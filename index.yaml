      created: "2026-08-25T02:58:44.794515256Z"
      description: 'External exposure for a values-driven list of subdomain routes to in-cluster Services, via one of four edgeType modes: "none" (bring your own ingress/LoadBalancer — default), "internal" (Caddy, self-signed "tls internal" certs), "tailscale" (one Ingress per route, exposed through the Tailscale Kubernetes operator + Funnel), or "alb" (one Ingress covering all routes via host-based rules, backed by a single internal AWS Application Load Balancer through the AWS Load Balancer Controller). The "internal" mode was extracted from charts/straiker-core/charts/straiker-frontend''s formerly-nested "internal-edge" component (frontend-only, one hardcoded route) into its own top-level chart once a second real consumer showed up (charts/straiker-defend''s API), matching this repo''s "small, independent charts" pattern (straiker-inference, straiker-artifact) over nesting a new subchart under straiker-core. '
