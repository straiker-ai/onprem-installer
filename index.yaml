  straiker-inference:
  - apiVersion: v2
    appVersion: 0.1.2
    created: "2026-08-14T23:51:57.764326822Z"
    description: 'vLLM inference server — serves a single LLM whose weights are synced
      from global.modelBucket (S3/GCS) by an init container or node-local DaemonSet
      cache. One release per model (set modelProfile; everything else — origin, GPU
      tier, served names — is derived). Ported from charts/straiker-platform-old/charts/straiker-inference:
      same chart, installed independently per model (install-straiker.sh loops over
      whichever models the selected products need) rather than bundled into an umbrella
      — consistent with this repo''s "small charts, independent apply/check" charts. '
