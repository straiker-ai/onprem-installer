  straiker-artifact:
  - apiVersion: v2
    appVersion: 1.0.0
    created: "2026-08-14T23:51:57.474912362Z"
    description: 'Mirrors container images from Straiker''s registry into the customer''s
      ECR and syncs model artifacts from Straiker''s bucket into the customer''s S3
      bucket, via in-cluster Jobs. Installed and polled to completion before charts/straiker-system,
      since that chart''s workloads pull images through the ECR mirror this populates. '
