  straiker-inference:
    - apiVersion: v2
      appVersion: 0.1.2
      created: "2026-08-19T19:23:32.776794984Z"
      description: 'vLLM inference server — serves a single LLM whose weights are synced from global.modelBucket (S3/GCS) by an initContainer, either straight into a node-local hostPath cache (marker-gated, so a later pod on the same node skips the download) or into an emptyDir when node-local caching is off. One release per model (set modelProfile; everything else — origin, GPU tier, served names — is derived). Ported from charts/straiker-platform-old/charts/straiker-inference: same chart, installed independently per model (install-straiker.sh loops over whichever models the selected products need) rather than bundled into an umbrella — consistent with this repo''s "small charts, independent apply/check" charts. '
