  straiker-system:
  - apiVersion: v2
    appVersion: 1.0.0
    created: "2026-08-13T07:37:43.278811219Z"
    dependencies:
    - name: opensearch
      repository: https://opensearch-project.github.io/helm-charts
      tags:
      - opensearch
      version: 3.6.0
    description: 'Straiker cluster + infrastructure chart — provisions everything
      app charts need before they start: Karpenter NodePools, NVIDIA device plugin,
      EFS/Filestore StorageClasses, and shared stateful infra (OpenSearch, optional
      Postgres/Redis). Redpanda lives in its own chart. No in-cluster registry — see
      the straiker-artifact chart for how container images and model artifacts reach
      this cluster''s ECR/S3 mirror before this chart''s workloads pull from it. '
