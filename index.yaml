  straiker-defend:
    - apiVersion: v2
      appVersion: 0.1.25
      created: "2026-08-19T19:23:32.425872739Z"
      description: 'Argus detection engine (Straiker''s "Defend" product) plus its settings-sync daemon and an in-cluster Redpanda Connect (Benthos) pipeline that archives detection turns into charts/straiker-system''s OpenSearch. Ported from charts/straiker-platform-old/charts/straiker-argus, updated to match the current ~/argus/onprem/docker-compose.yml architecture: HTTP-based Redpanda Connect archiving instead of a Kafka-broker cluster, straiker-system''s existing Redis instead of a second one, and no External Secrets Operator dependency (single-namespace on-prem install has no cross-namespace secret to sync). '
      digest: 29b84e429265de31a672604735173cae701549c20c5a209dd4461ffdfc7d58cc
