{{- $svc := .Values.straiker.apiGateway.service }}
{{- $exposure := $svc.exposure | default "internal" }}
{{- if not (has $exposure (list "internal" "public" "none")) }}
{{- fail (printf "straiker.apiGateway.service.exposure must be internal, public or none (got %q)" $exposure) }}
{{- end }}
{{- if and (eq $exposure "public") (not $svc.certificateArn) }}
{{- fail "straiker.apiGateway.service.certificateArn (an ACM certificate) is required when exposure is public: the gateway is never exposed to the internet without TLS" }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "straiker.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "straiker.labels" . | nindent 4 }}
  annotations:
    {{- if ne $exposure "none" }}
    {{- if eq (toString $svc.awsLoadBalancerController) "true" }}
    # AWS Load Balancer Controller (installed with edge types alb/xalb): an NLB, internal unless exposure is public.
    # TLS ends at the NLB (backend is HTTP :8080).
    service.beta.kubernetes.io/aws-load-balancer-type: external
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    service.beta.kubernetes.io/aws-load-balancer-scheme: {{ ternary "internet-facing" "internal" (eq $exposure "public") }}
    {{- else }}
    # No controller in the cluster: the cloud provider's built-in one provisions the load balancer, and it ignores the
    # annotations above (it would create an INTERNET-FACING classic ELB, or leave a Service with no load balancer).
    # These are the ones it honours: an NLB, internal unless exposure is public.
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    {{- if ne $exposure "public" }}
    service.beta.kubernetes.io/aws-load-balancer-internal: "true"
    {{- end }}
    {{- end }}
    {{- end }}
    {{- if eq $exposure "public" }}
    service.beta.kubernetes.io/aws-load-balancer-ssl-cert: {{ $svc.certificateArn | quote }}
    service.beta.kubernetes.io/aws-load-balancer-ssl-ports: "443"
    service.beta.kubernetes.io/aws-load-balancer-ssl-negotiation-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    {{- end }}
    {{- with $svc.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    app.straiker.io/app: api-gateway
    {{- include "straiker.selectorLabels" . | nindent 4 }}
  ports:
    - name: https
      protocol: TCP
      port: 443
      targetPort: 8080
  type: {{ ternary "ClusterIP" "LoadBalancer" (eq $exposure "none") }}
  {{- if and (eq $exposure "public") $svc.sourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml $svc.sourceRanges | nindent 4 }}
  {{- end }}
