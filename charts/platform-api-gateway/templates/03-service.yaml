apiVersion: v1
kind: Service
metadata:
  name: {{ include "straiker.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "straiker.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.straiker.apiGateway.service.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    app.straiker.io/app: api-gateway
    {{- include "straiker.selectorLabels" . | nindent 4 }}
  ports:
    - name: https
      protocol: TCP
      port: 443
      targetPort: 8080
  type: LoadBalancer
