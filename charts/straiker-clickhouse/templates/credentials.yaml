{{- /* User passwords come from Secret .Values.passwordsSecret (ESO-synced from Secrets Manager, keys <user>_password);
       empty = legacy: generate once and keep across upgrades. */ -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace .Values.credentialsSecret).data | default dict }}
{{- $source := dict }}
{{- if .Values.passwordsSecret }}
{{- $source = (lookup "v1" "Secret" .Release.Namespace .Values.passwordsSecret).data | default dict }}
{{- range $u, $_ := .Values.users }}
{{- if not (hasKey $source (printf "%s_password" $u)) }}
{{- fail (printf "Secret %q has no key %s_password. Run phase 'clickhouse' (it syncs it from Secrets Manager through External Secrets), or set passwordsSecret=\"\" to generate passwords in-cluster." $.Values.passwordsSecret $u) }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.credentialsSecret }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  host: {{ printf "%s.%s.svc.cluster.local" (include "ch.fullname" .) .Release.Namespace | quote }}
  # Replica 0, for DDL (grid migrations, ch-sync init): one replica, so a statement always sees the previous one.
  ddlHost: {{ include "ch.replicaHost" (dict "root" . "i" 0) | quote }}
  nativePort: {{ .Values.ports.native | quote }}
  httpPort: {{ .Values.ports.http | quote }}
{{- range $u, $_ := .Values.users }}
  {{ $u }}_username: {{ $u | quote }}
  {{ $u }}_password: {{ if $.Values.passwordsSecret }}{{ index $source (printf "%s_password" $u) | b64dec | quote }}{{ else if hasKey $existing (printf "%s_password" $u) }}{{ index $existing (printf "%s_password" $u) | b64dec | quote }}{{ else }}{{ randAlphaNum 32 | quote }}{{ end }}
{{- end }}
