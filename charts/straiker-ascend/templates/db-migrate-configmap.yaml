          "changeSet": {
            "id": "create-recon-update-trigger-function",
            "author": "iris",
            "preConditions": {
              "onFail": "MARK_RAN",
              "onError": "MARK_RAN",
              "not": {
                "sqlCheck": {
                  "expectedResult": "1",
                  "sql": "SELECT 1 FROM pg_proc p JOIN pg_namespace n ON p.pronamespace = n.oid WHERE n.nspname = 'public' AND p.proname = 'update_updated_at_column'"
                }
              }
            },
            "changes": [
              {
                "sql": {
                  "sql": "CREATE OR REPLACE FUNCTION update_updated_at_column() RETURNS TRIGGER AS $$ BEGIN NEW.updated_at = CURRENT_TIMESTAMP; RETURN NEW; END; $$ language 'plpgsql'"
                }
              }
            ]
          }
        },
        {
          "changeSet": {
            "id": "create-recon-triggers",
            "author": "iris",
            "preConditions": {
              "onFail": "MARK_RAN",
              "onError": "MARK_RAN",
              "not": {
                "sqlCheck": {
                  "expectedResult": "1",
                  "sql": "SELECT 1 FROM pg_trigger WHERE tgname = 'update_recon_request_updated_at'"
                }
              }
            },
            "changes": [
              {
                "sql": {
                  "sql": "DROP TRIGGER IF EXISTS update_recon_request_updated_at ON recon_request; CREATE TRIGGER update_recon_request_updated_at BEFORE UPDATE ON recon_request FOR EACH ROW EXECUTE FUNCTION update_updated_at_column();"
                }
              },
              {
                "sql": {
                  "sql": "DROP TRIGGER IF EXISTS update_recon_tasks_updated_at ON recon_tasks; CREATE TRIGGER update_recon_tasks_updated_at BEFORE UPDATE ON recon_tasks FOR EACH ROW EXECUTE FUNCTION update_updated_at_column();"
                }
              }
            ]
          }
        },
