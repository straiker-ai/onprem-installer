{{- /*
  No Secret is created by this chart. Every component reads required keys
  from "straiker-secrets" via secretKeyRef — most are auto-provisioned by
  install-straiker.sh's phase_shared_secrets (INTERNAL_API_KEY,
  IRIS_ADMIN_API_KEY, SYS__INFERENCE_API_KEY), same as charts/straiker-
  defend's secrets.

  One key is NOT auto-provisioned by phase_shared_secrets and must be set
  manually (same value on both sides of the install):

    ARGUS_SERVICE_API_KEY — read here as SYS__ARGUS_API_KEY (probe-worker.yaml,
                         recon-worker.yaml). No longer the deferred per-app
                         tenant-database key this comment used to describe -
                         argus's /api/v1/detect now accepts a genuine
                         service-to-service key with no real per-app tenant
                         record (settings.argus_service_api_key on argus's
                         side, see argus/api/deps/auth.py's
                         verify_api_key_or_service). charts/straiker-defend
                         reads this identical secret key as
                         SYS__ARGUS_SERVICE_API_KEY - both charts must point
                         at the same value for iris's detection calls to
                         actually authenticate. Left optional in both
                         charts' secretKeyRef - argus falls through to its
                         normal per-tenant auth (401 without a real tenant
                         key) until this is set; everything else keeps
                         working either way.

    BIFROST_API_KEY — only load-bearing if bifrost.baseUrl (values.yaml) is
                         overridden to point at a virtual-key-enforcing
                         Bifrost instead of the default in-cluster one (e.g.
                         a Straiker-hosted PoC/trial gateway) -- the default
                         in-cluster charts/straiker-core/charts/straiker-
                         bifrost doesn't check this key at all, so it's a
                         no-op otherwise.

    IRIS_PRIVATELINK_API_KEY — only load-bearing if probeShadow.enabled is
                         flipped back on (disabled by default on-prem, see
                         values.yaml's probeShadow comment). probe-worker
                         sends this as a bearer token (http_request_handler.py)
                         and probe-shadow verifies it (probe_shadow/app.py) -
                         same value on both sides. Not auto-provisioned by
                         install-straiker.sh's phase_shared_secrets; set
                         manually before enabling probe-shadow.
*/ -}}
