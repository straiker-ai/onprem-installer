apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  labels:
    app.kubernetes.io/name: straiker-otel
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc: { endpoint: 0.0.0.0:4317 }
          http: { endpoint: 0.0.0.0:4318 }
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 400
        spike_limit_mib: 100
      probabilistic_sampler:
        sampling_percentage: {{ .Values.traceSamplePercent }}
      batch: {}
    exporters:
      awsxray:
        region: {{ .Values.awsRegion | quote }}
      awsemf:
        region: {{ .Values.awsRegion | quote }}
        namespace: {{ .Values.metricNamespace | quote }}
        log_group_name: {{ printf "/aws/straiker/%s/otel-metrics" .Values.clusterName | quote }}
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, probabilistic_sampler, batch]
          exporters: [awsxray]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [awsemf]
