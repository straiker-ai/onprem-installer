{{- if .Values.straiker.databridge.roles.api.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "straiker.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "straiker.labels" . | nindent 4 }}
  {{- with .Values.straiker.databridge.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  selector:
    app.straiker.io/app: databridge
    app.straiker.io/role: api
    {{- include "straiker.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: {{ .Values.straiker.databridge.port }}
  type: ClusterIP
{{- end }}
