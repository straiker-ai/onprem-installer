{{- $top := . }}
{{- $db := .Values.straiker.databridge }}
{{- $otel := $db.observability.otel }}
{{- $otelEnabled := $otel.enabled | default true }}
{{- if and $otelEnabled ($otel.strictNamespaceEnrollment | default false) }}
{{- $ns := lookup "v1" "Namespace" "" .Release.Namespace }}
{{- if $ns }}
{{- $labelKey := $otel.namespaceLabelKey | default "observability.straiker.io/otel-enabled" }}
{{- $expectedValue := $otel.namespaceLabelValue | default "true" }}
{{- $labels := default (dict) $ns.metadata.labels }}
{{- $actualValue := get $labels $labelKey }}
{{- if ne (toString $actualValue) (toString $expectedValue) }}
{{- fail (printf "OTel contract: namespace %q must have label %s=%s" .Release.Namespace $labelKey $expectedValue) }}
{{- end }}
{{- else if ($otel.failWhenNamespaceLookupUnavailable | default false) }}
{{- fail (printf "OTel contract: could not verify namespace label for %q (lookup unavailable)" .Release.Namespace) }}
{{- end }}
{{- end }}
{{- range $role, $cfg := $db.roles }}
{{- if $cfg.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.straiker.io/app: databridge
    app.straiker.io/role: {{ $role }}
    {{- include "straiker.labels" $top | nindent 4 }}
  {{- with $db.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  name: {{ include "straiker.name" $top }}-{{ $role }}
  namespace: {{ $top.Release.Namespace }}
spec:
  replicas: {{ $cfg.replicas }}
  selector:
    matchLabels:
      app.straiker.io/app: databridge
      app.straiker.io/role: {{ $role }}
      {{- include "straiker.selectorLabels" $top | nindent 6 }}
  template:
    metadata:
      labels:
        app.straiker.io/app: databridge
        app.straiker.io/role: {{ $role }}
        {{- include "straiker.labels" $top | nindent 8 }}
    spec:
      serviceAccountName: {{ $db.serviceAccount.name }}
      {{- if $db.image.imagePullSecrets }}
      imagePullSecrets:
        {{- range $db.image.imagePullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      containers:
        - name: databridge
          ports:
            - name: http
              containerPort: {{ $db.port }}
              protocol: TCP
            {{- if and (eq $role "ingest") $cfg.listenerPort }}
            - name: listener
              containerPort: {{ $cfg.listenerPort }}
              protocol: TCP
            {{- end }}
          image: "{{ $db.image.registry }}/{{ $db.image.name }}:{{ $db.image.version }}"
          imagePullPolicy: {{ $db.image.pullPolicy }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          envFrom:
            - configMapRef:
                name: {{ include "straiker.name" $top }}-config
            # Shared platform-secret (required): missing secret fails the rollout
            # loudly instead of starting without the DB DSN / sink credentials.
            - secretRef:
                name: {{ $db.secretName }}
            {{- if $otelEnabled }}
            - secretRef:
                name: {{ $otel.secretName | default "otel-secret" }}
                {{- if not ($otel.requireSecret | default false) }}
                optional: true
                {{- end }}
            {{- end }}
          env:
            - name: DATABRIDGE_ROLE
              value: {{ $role | quote }}
            - name: OTEL_SERVICE_NAME
              value: "{{ $otel.serviceNameBase | default (include "straiker.name" $top) }}-{{ $role }}"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.version={{ $db.image.version }},deployment.environment={{ $db.environment }}"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if $db.redpanda.enabled }}
            # Chart-owned bus: point the bus brokers at the in-chart Redpanda
            # Service. Set here (env) so it wins over any value in the shared
            # platform-secret (env overrides envFrom).
            - name: DATABRIDGE_BUS_BROKERS
              value: "{{ include "straiker.name" $top }}-redpanda:9092"
            {{- end }}
          resources:
            {{- toYaml $db.resources | nindent 12 }}
      {{- with $db.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $db.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $db.topologySpread }}
      {{- if .enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .maxSkew }}
          {{- with .minDomains }}
          minDomains: {{ . }}
          {{- end }}
          topologyKey: {{ .topologyKey }}
          whenUnsatisfiable: {{ .whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              app.straiker.io/app: databridge
              app.straiker.io/role: {{ $role }}
              {{- include "straiker.selectorLabels" $top | nindent 14 }}
          {{- with .matchLabelKeys }}
          matchLabelKeys:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- end }}
      {{- end }}
      {{- with $db.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
{{- end }}
{{- end }}
