{{- if .Values.imageMirror.enabled }}
{{- $m := .Values.imageMirror }}
{{- $destHost := index (splitList "/" $.Values.ecrRegistry) 0 }}
apiVersion: batch/v1
kind: Job
metadata:
  name: straiker-artifact-image-mirror
  namespace: {{ include "artifact-sync.namespace" . }}
  labels:
    {{- include "artifact-sync.labels" . | nindent 4 }}
    app.kubernetes.io/component: artifact-sync
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/component: artifact-sync
    spec:
      serviceAccountName: {{ .Values.serviceAccountName }}
      restartPolicy: OnFailure
      {{- include "artifact-sync.tolerations" . | nindent 6 }}
      # crane is copied in from its own init container so the main container
      # only needs the aws-cli (for ECR login) -- crane itself has no aws-cli.
      initContainers:
        - name: crane
          image: {{ printf "%s:%s" $m.image.repository $m.image.tag | quote }}
          command: ["sh", "-c", "cp \"$(command -v crane)\" /shared/crane"]
          volumeMounts:
            - name: shared
              mountPath: /shared
      containers:
        - name: mirror
          image: {{ include "artifact-sync.mirrorToolImage" . }}
          # Token broker (Lambda Function URL) returns KEY=VALUE lines for
          # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_SESSION_TOKEN.
          # eval-sourcing them gives the assumed-role credentials needed to
          # pull from the source ECR and push to the destination ECR without
          # holding any long-lived keys in the cluster.
          command:
            - sh
            - -c
            - |
              set -euo pipefail
              export PATH="/shared:$PATH"
              source_api_key="$(sed -n 's/.*"api_key"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' /var/secrets/source/key.json)"
              source_customer_email="$(sed -n 's/.*"customer_email"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' /var/secrets/source/key.json)"
              if [[ -z "${source_api_key}" || -z "${source_customer_email}" ]]; then
                echo "Missing broker credentials in /var/secrets/source/key.json" >&2
                exit 1
              fi
              if ! token_env="$(curl -fsS -H "Authorization: Bearer ${source_api_key}" -H "X-Customer-Email: ${source_customer_email}" {{ printf "%s/token" .Values.brokerUrl | quote }})"; then
                echo "Token broker request failed (HTTP error). Check STRAIKER_CUSTOMER_KEY / customer email entitlement." >&2
                exit 1
              fi
              eval "${token_env}"
              if [[ -z "${AWS_ACCESS_KEY_ID:-}" || -z "${AWS_SECRET_ACCESS_KEY:-}" || -z "${AWS_SESSION_TOKEN:-}" ]]; then
                echo "Broker token response missing AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY/AWS_SESSION_TOKEN." >&2
                exit 1
              fi
              # Login to source ECR with assumed-role creds, dest ECR with Pod Identity.
              # `aws ecr get-login-password` issues a token scoped to whatever
              # region it's run in -- without an explicit --region, both calls
              # would fall back to the pod's own ambient default region (the
              # customer's cluster region), which is wrong for the SOURCE
              # login whenever that differs from Straiker's own us-east-1
              # (surfaces as ECR's generic "DENIED: Your Authorization Token
              # is invalid", not a region-mismatch error). Derive each token's
              # region from its own registry host instead of assuming either
              # side matches the pod's default.
              SOURCE_HOST="{{ index (splitList "/" .Values.sourceEcrRegistry) 0 }}"
              crane auth login "${SOURCE_HOST}" \
                --username AWS --password "$(AWS_ACCESS_KEY_ID="${AWS_ACCESS_KEY_ID}" AWS_SECRET_ACCESS_KEY="${AWS_SECRET_ACCESS_KEY}" AWS_SESSION_TOKEN="${AWS_SESSION_TOKEN}" aws ecr get-login-password --region {{ index (splitList "." .Values.sourceEcrRegistry) 3 | quote }})"
              crane auth login {{ $destHost | quote }} \
                --username AWS --password "$(aws ecr get-login-password --region {{ index (splitList "." $destHost) 3 | quote }})"
              {{- range $img := $m.images }}
              {{- $imgSku := include "artifact-sync.imageSku" $img.source }}
              {{- if or (eq $imgSku "base") (eq $imgSku $.Values.customerSku) }}
              echo "Mirroring {{ $img.source }}:{{ $img.tag }} -> {{ $.Values.ecrRegistry }}/{{ $img.destRepository }}:{{ $img.tag }}..."
              crane copy "{{ $img.source }}:{{ $img.tag }}" "{{ $.Values.ecrRegistry }}/{{ $img.destRepository }}:{{ $img.tag }}"
              {{- else }}
              echo "Skipping {{ $img.source }}:{{ $img.tag }} (sku: {{ $imgSku }}) -- not included for this customer's sku ({{ $.Values.customerSku }})."
              {{- end }}
              {{- end }}
              echo "Image mirror complete."
          volumeMounts:
            - name: shared
              mountPath: /shared
            - name: straiker-credential
              mountPath: /var/secrets/source
              readOnly: true
          resources:
            {{- toYaml $m.resources | nindent 12 }}
      volumes:
        - name: shared
          emptyDir: {}
        - name: straiker-credential
          secret:
            secretName: {{ .Values.straikerCredentialSecretName }}
{{- end }}
