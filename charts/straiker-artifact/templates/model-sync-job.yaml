{{- if .Values.modelSync.enabled }}
{{- $s := .Values.modelSync }}
apiVersion: batch/v1
kind: Job
metadata:
  name: straiker-artifact-model-sync
  namespace: {{ include "artifact-sync.namespace" . }}
  labels:
    {{- include "artifact-sync.labels" . | nindent 4 }}
    app.kubernetes.io/component: artifact-sync
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/component: artifact-sync
    spec:
      serviceAccountName: {{ .Values.serviceAccountName }}
      restartPolicy: OnFailure
      {{- include "artifact-sync.tolerations" . | nindent 6 }}
      containers:
        - name: sync
          image: {{ printf "%s:%s" $s.image.repository $s.image.tag | quote }}
          # Token broker (Lambda Function URL) returns KEY=VALUE lines consumed
          # via eval. Credentials are re-minted before each model so a
          # multi-model sync that runs past 1 h never hits expired creds.
          # Destination: S3 via EKS Pod Identity (env_auth=true on the rclone
          # remote). Source: S3 with the assumed-role creds from the broker.
          command:
            - sh
            - -c
            - |
              set -euo pipefail
              source_api_key="$(sed -n 's/.*"api_key"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' /var/secrets/source/key.json)"
              source_customer_email="$(sed -n 's/.*"customer_email"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' /var/secrets/source/key.json)"
              {{- range $model := $s.models }}
              {{- if or (not $s.enabledModels) (has $model.destPath $s.enabledModels) }}
              echo "Syncing s3://{{ $s.sourceBucket }}/{{ $model.path }} -> s3://{{ $.Values.modelsBucket }}/models/{{ $model.destPath }}..."
              eval "$(wget -qO- \
                --header "Authorization: Bearer ${source_api_key}" \
                --header "X-Customer-Email: ${source_customer_email}" \
                {{ printf "%s/token" $.Values.brokerUrl | quote }})"
              rclone sync \
                --s3-access-key-id "${AWS_ACCESS_KEY_ID}" \
                --s3-secret-access-key "${AWS_SECRET_ACCESS_KEY}" \
                --s3-session-token "${AWS_SESSION_TOKEN}" \
                --s3-region {{ $.Values.sourceBucketRegion | default "us-east-1" | quote }} \
                ":s3:{{ $s.sourceBucket }}/{{ $model.path }}" \
                ":s3,env_auth=true:{{ $.Values.modelsBucket }}/models/{{ $model.destPath }}" \
                --progress --transfers 8 --checkers 16
              {{- else }}
              echo "Skipping {{ $model.destPath }} (not in modelSync.enabledModels)."
              {{- end }}
              {{- end }}
              echo "Model sync complete."
          volumeMounts:
            - name: straiker-credential
              mountPath: /var/secrets/source
              readOnly: true
          resources:
            {{- toYaml $s.resources | nindent 12 }}
      volumes:
        - name: straiker-credential
          secret:
            secretName: {{ .Values.straikerCredentialSecretName }}
{{- end }}
