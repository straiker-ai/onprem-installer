{{- if or .Values.imageMirror.enabled .Values.modelSync.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccountName }}
  namespace: {{ include "artifact-sync.namespace" . }}
  labels:
    {{- include "artifact-sync.labels" . | nindent 4 }}
    app.kubernetes.io/component: artifact-sync
  {{- if .Values.gcpServiceAccountEmail }}
  annotations:
    # Binds this KSA to the GCP SA via Workload Identity — GKE's equivalent
    # of EKS Pod Identity (which needs no such annotation, just the
    # association Terraform creates). Only meaningful when cloudProvider: gke.
    iam.gke.io/gcp-service-account: {{ .Values.gcpServiceAccountEmail }}
  {{- end }}
{{- end }}
