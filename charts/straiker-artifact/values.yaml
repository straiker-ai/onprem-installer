# Selects the destination registry auth flow (image-mirror-job.yaml) and
# rclone remote type (model-sync-job.yaml): ECR + S3 on eks, Artifact
# Registry + GCS on gke. Source side (Straiker's own GAR + GCS bucket) is
# unaffected either way.
cloudProvider: eks

# ecrRegistry/modelsBucket: populated by the installer from the
# terraform/aws/artifacts (or terraform/gcp/artifacts, on GKE) outputs.
# Reused as-is for GKE (holding the Artifact Registry host / GCS bucket name
# respectively) rather than adding parallel gke-specific field names —
# they're already just "the destination registry"/"the destination bucket"
# regardless of which cloud actually backs them. Everything else here is
# fixed for this project (Straiker's own source registry/bucket, not
# customer-configurable) and should not be overridden per-install.
straikerCredentialSecretName: straiker-credential
serviceAccountName: straiker-artifact-hauler
ecrRegistry: ""
modelsBucket: ""
# GKE only — terraform/gcp/artifacts' hauler_service_account_email output.
# Binds this chart's ServiceAccount to that GCP SA via Workload Identity.
# Leave empty on EKS (Pod Identity needs no such annotation).
gcpServiceAccountEmail: ""
# Populated by the installer, parsed from the credential file's "sku" field
# — decides which images below get attempted at all. Falls back to "base" if
# it can't be determined (see detect_customer_sku in install-straiker.sh).
customerSku: "base"
# Fixed, not customer-configurable — Straiker's own artifact-broker
# endpoint, the same for every install. The mounted straiker-credential
# file's api_key + customer_email are exchanged here for a short-lived
# pull token (see image-mirror-job.yaml / model-sync-job.yaml).
brokerUrl: "https://2a7owzgkie5zw6dfl4qqg6tfhe0pqkvb.lambda-url.us-east-1.on.aws"
# Source-side ECR registry (Straiker's own account) — the broker's assumed-role
# credentials grant read access to this registry. Populated by the installer
# from the broker's /whoami response or a known fixed value.
sourceEcrRegistry: "631748089429.dkr.ecr.us-east-1.amazonaws.com"
# AWS region for the source S3 models bucket (Straiker's account).
sourceBucketRegion: "us-east-1"

imageMirror:
  enabled: false
  images:
    - source: 631748089429.dkr.ecr.us-east-1.amazonaws.com/onprem-base/nvidia/k8s-device-plugin
      tag: v0.17.0
      destRepository: nvidia/k8s-device-plugin
    - source: 631748089429.dkr.ecr.us-east-1.amazonaws.com/onprem-base/opensearchproject/opensearch
      tag: "3.6.0"
      destRepository: opensearchproject/opensearch
    - source: 631748089429.dkr.ecr.us-east-1.amazonaws.com/onprem-base/timberio/vector
      tag: "0.55.0-distroless-libc"
      destRepository: timberio/vector
    - source: 631748089429.dkr.ecr.us-east-1.amazonaws.com/onprem-base/valkey/valkey
      tag: "8-alpine"
      destRepository: valkey/valkey
    - source: 631748089429.dkr.ecr.us-east-1.amazonaws.com/onprem-base/library/postgres
      tag: "16-alpine"
      destRepository: library/postgres
    - source: 631748089429.dkr.ecr.us-east-1.amazonaws.com/onprem-base/maximhq/bifrost
      tag: v1.6.7
      destRepository: maximhq/bifrost
    - source: 631748089429.dkr.ecr.us-east-1.amazonaws.com/onprem-base/dexidp/dex
      tag: v2.45.1
      destRepository: dexidp/dex
    - source: 631748089429.dkr.ecr.us-east-1.amazonaws.com/onprem-base/library/caddy
      tag: 2-alpine
      destRepository: library/caddy
    - source: 631748089429.dkr.ecr.us-east-1.amazonaws.com/onprem-base/aws-cli/aws-cli 
      tag: 2.24.24
      destRepository: aws-cli/aws-cli
    - source: 631748089429.dkr.ecr.us-east-1.amazonaws.com/onprem-base/liquibase/liquibase
      tag: "4.28"
      destRepository: liquibase/liquibase
    - source: 631748089429.dkr.ecr.us-east-1.amazonaws.com/onprem-base/redpandadata/connect
      tag: "4.101.0"
      destRepository: redpandadata/connect
    # Straiker's own apps — under onprem-base/straiker/* (an extra
    # segment vs the third-party images above) since it's not upstream.
    - source: 631748089429.dkr.ecr.us-east-1.amazonaws.com/onprem-base/straiker/vllm
      tag: v0.27.0
      destRepository: straiker/vllm
    - source: 631748089429.dkr.ecr.us-east-1.amazonaws.com/onprem-base/straiker/frontend
      tag: onprem-v2026.8.3
      destRepository: straiker/frontend
    - source: 631748089429.dkr.ecr.us-east-1.amazonaws.com/onprem-base/straiker/frontend-migrate
      tag: onprem-v2026.8.3
      destRepository: straiker/frontend-migrate
    - source: 631748089429.dkr.ecr.us-east-1.amazonaws.com/onprem-base/straiker/argus
      tag: onprem-v2026.7.29.2
      destRepository: straiker/argus
    - source: 631748089429.dkr.ecr.us-east-1.amazonaws.com/onprem-base/straiker/iris
      tag: onprem-v2026.8.13.10
      destRepository: straiker/iris
  image:
    repository: gcr.io/go-containerregistry/crane
    tag: debug
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1
      memory: 1Gi

modelSync:
  enabled: false
  sourceBucket: onprem-artifact-models
  # Leave empty to sync every model in the list below (the old, simpler
  # behavior — still the default for anyone applying this chart standalone).
  # install-straiker.sh's phase_artifacts_sync sets this to exactly the
  # models the selected products actually need (same
  # inference_models_for_products mapping charts/straiker-inference's
  # per-model release loop uses, so this can't drift out of sync with what
  # actually gets deployed), to skip syncing the ~10GB/model of bandwidth
  # for ones that will never run.
  enabledModels: []
  # Explicit path/destPath per model, not a shared version — the source GCS
  # bucket doesn't tag every model's export the same way (confirmed not
  # unified across models), so each entry needs updating independently
  # whenever its underlying export changes. destPath must match
  # charts/straiker-inference's modelProfiles storagePrefix for whichever
  # models are enabled, or this Job populates a path that chart never looks
  # for.
  models:
    - path: huggingface/antman/9b1ed457baf4
      destPath: antman
    - path: huggingface/hulk/733e4e123828
      destPath: hulk
    - path: huggingface/quicksilver/e54037e4c285
      destPath: quicksilver
    - path: huggingface/thor/f516550d4db9
      destPath: thor
    - path: huggingface/thanos/94cc8385641b
      destPath: thanos
    - path: huggingface/wanda/290caf700ef4
      destPath: wanda
    - path: huggingface/vision/0bbfe0f2ff76
      destPath: vision
  image:
    repository: rclone/rclone
    tag: "1.68"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 2
      memory: 2Gi
