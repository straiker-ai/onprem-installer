{{- if eq .Values.edgeType "tailscale" }}
{{- range .Values.routes }}
{{- $hostname := .subdomain }}
{{- if $.Values.tailscale.hostnamePrefix }}
{{- $hostname = printf "%s-%s" $.Values.tailscale.hostnamePrefix .subdomain }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .name }}
  namespace: {{ include "edge.namespace" $ }}
  labels:
    {{- include "edge.labels" $ | nindent 4 }}
  annotations:
    tailscale.com/funnel: {{ $.Values.tailscale.funnel | quote }}
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - {{ $hostname | quote }}
  defaultBackend:
    service:
      name: {{ .targetService }}
      port:
        number: {{ .targetPort }}
---
{{- end }}
{{- end }}
