{{- if or (eq .Values.edgeType "internal") (eq .Values.edgeType "tailscale") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: straiker-edge
  namespace: {{ include "edge.namespace" . }}
  labels:
    {{- include "edge.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: straiker-edge
  template:
    metadata:
      labels:
        app: straiker-edge
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: caddy
          image: {{ include "edge.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 80
              name: http
            - containerPort: {{ .Values.httpsPort }}
              name: https
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
              readOnly: true
            - name: data
              mountPath: /data
            - name: config-dir
              mountPath: /config
            {{- if eq .Values.edgeType "tailscale" }}
            - name: tls
              mountPath: /etc/caddy-tls
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: straiker-edge-config
        # Disposable — self-signed certs regenerate on restart.
        - name: data
          emptyDir: {}
        - name: config-dir
          emptyDir: {}
        {{- if eq .Values.edgeType "tailscale" }}
        # Written by cert-manager's Certificate (templates/cert-manager.yaml)
        # -- real, browser-trusted cert for tailscale.domain, not disposable.
        - name: tls
          secret:
            secretName: {{ .Values.tailscale.certificateSecretName }}
        {{- end }}
      nodeSelector:
        {{- include "edge.nodeSelector" . | nindent 8 }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
