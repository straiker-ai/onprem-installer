# global.dockerRegistry: same convention as every other chart in this repo —
# when set, Caddy's image (relative repository, no registry host) resolves
# against this instead of pulling directly from Straiker's own registry.
# global.appDomain: must match charts/straiker-core's own global.appDomain —
# both charts need the same base domain for their routed hostnames to agree
# (e.g. dex's OIDC issuer, computed in straiker-frontend, must be reachable
# at the exact host this chart actually routes).
# global.sharedNodeSelector: same convention/value as charts/straiker-core and
# charts/straiker-system (targets the untainted "general" NodePool).
global:
  dockerRegistry: ""
  appDomain: straiker.internal
  sharedNodeSelector:
    purpose: general

# none       — install nothing; bring your own ingress/LoadBalancer pointed
#              at routes[]'s targetService/targetPort Services directly
#              (default).
# internal   — Caddy reverse proxy with self-signed "tls internal" certs.
# tailscale  — same Caddy reverse proxy as internal, but with a real
#              cert-manager/Let's Encrypt certificate for the customer's own
#              domain (see tailscale.* below) instead of a self-signed one,
#              and its Service exposed onto the customer's own Tailscale
#              tailnet at L3 (tailscale.com/expose, via the Tailscale
#              Kubernetes operator installed separately) instead of staying
#              ClusterIP-only. Deliberately not an Ingress with
#              ingressClassName: tailscale -- that IngressClass always
#              terminates TLS with its own ts.net-issued cert and ignores a
#              custom domain's cert-manager secret (tailscale/tailscale#12709).
# alb        — one Ingress covering all of routes[] (host-based rules),
#              ingressClassName: alb, backed by a single internal AWS
#              Application Load Balancer via the AWS Load Balancer
#              Controller (installed separately). See alb.* below.
# xalb       — same shape as alb, but internet-facing and sharing an ALB
#              with other Ingress objects on this cluster via IngressGroup
#              (so future Ingresses don't each get their own ALB). Always
#              backed by a real, DNS-validated ACM certificate (never
#              self-signed) — see xalb.* below.
edgeType: none

# Only used when edgeType: alb. Requires the AWS Load Balancer Controller
# to be running in the cluster — this chart doesn't install it itself, but
# scripts/install-straiker.sh's phase_alb_controller does (via
# terraform/aws/edge + its Helm chart) — it's what turns this Ingress into
# an actual ALB.
alb:
  # Base domain for hostnames: <route.albSubdomain>.<domain>, e.g.
  # "acmecorp.com" -> straiker.acmecorp.com, straiker-defend.acmecorp.com,
  # straiker-ascend.acmecorp.com. Required when edgeType: alb.
  domain: ""
  # ACM certificate ARN. Required — without it the ALB gets no HTTPS
  # listener at all (the AWS Load Balancer Controller only adds one when a
  # cert is present). Request via DNS validation; that works even with
  # zero public reachability, only a Route53 CNAME is needed to prove
  # domain control.
  certificateArn: ""
  # CIDR(s) allowed to reach the ALB. Required — the AWS Load Balancer
  # Controller has no restriction by default otherwise (0.0.0.0/0).
  inboundCidrs: ""
  # Comma-separated subnet IDs. Leave blank to rely on the AWS Load
  # Balancer Controller's subnet auto-discovery
  # (kubernetes.io/role/internal-elb=1 tag on private subnets).
  subnets: ""
  # IngressClass created by the AWS Load Balancer Controller. Default
  # matches its out-of-the-box name; override only if the customer's
  # install uses a non-default one.
  ingressClassName: alb

# Only used when edgeType: xalb. Same AWS Load Balancer Controller as alb.*
# above (installed the same way), but internet-facing.
xalb:
  # Base domain for hostnames — same convention as alb.domain above.
  # Required when edgeType: xalb.
  domain: ""
  # ACM certificate ARN. Always real, never self-signed: either
  # auto-issued+DNS-validated (terraform/aws/edge's route53.tf, the
  # default) and set by scripts/install-straiker.sh's phase_edge_infra, or
  # an explicit ARN you provide via --alb-certificate-arn when Route53
  # automation is skipped (--xalb-skip-route53).
  certificateArn: ""
  # CIDR(s) allowed to reach the ALB. Optional and blank by default, unlike
  # alb.inboundCidrs — this is a genuinely public endpoint, so the AWS Load
  # Balancer Controller's own default (0.0.0.0/0) is the appropriate
  # starting point. Set this only if you want to additionally restrict a
  # public-facing endpoint to known source ranges.
  inboundCidrs: ""
  # IngressGroup name — lets future Ingress objects on this cluster share
  # this same external ALB instead of each provisioning their own.
  groupName: straiker-external
  # IngressClass created by the AWS Load Balancer Controller. Default
  # matches its out-of-the-box name; override only if the customer's
  # install uses a non-default one.
  ingressClassName: alb

tailscale:
  # Only used when edgeType: tailscale. Base domain for hostnames, same
  # convention as alb.domain/xalb.domain: <route.albSubdomain>.<domain>
  # (e.g. straiker.acmecorp.com). Required when edgeType: tailscale. There's
  # no Tailscale-account collision to avoid here (unlike the old
  # hostnamePrefix field this replaces) since this domain is always the
  # customer's own, unique by construction.
  domain: ""
  # Contact email for the Let's Encrypt ACME account (ClusterIssuer).
  # Required when edgeType: tailscale.
  clusterIssuerEmail: ""
  # Route53 public hosted zone ID for domain, looked up by
  # terraform/aws/edge (same lookup xalb's Route53 automation already does
  # for its own DNS-validated ACM certificate) and set by
  # scripts/install-straiker.sh's phase_edge_infra. Required when edgeType:
  # tailscale -- cert-manager's Route53 DNS-01 solver needs it to know which
  # zone to write the challenge TXT record into.
  hostedZoneId: ""
  # AWS region for the Route53 DNS-01 solver. Required when edgeType: tailscale.
  region: ""
  # Secret name cert-manager's Certificate (templates/cert-manager.yaml)
  # writes the issued cert/key into -- mounted into Caddy
  # (templates/deployment.yaml) in place of the self-signed "tls internal"
  # edgeType: internal uses.
  certificateSecretName: straiker-edge-tailscale-tls

image:
  repository: library/caddy
  tag: 2-alpine
  pullPolicy: IfNotPresent

replicas: 1

nodeSelector: {}
tolerations: []

resources:
  requests:
    cpu: "100m"
    memory: "64Mi"
  limits:
    cpu: "500m"
    memory: "256Mi"

# Not the standard 443 — no sudo needed to bind locally without an ingress.
# Drives every route's site address and this chart's own container/Service
# port together. charts/straiker-frontend's own edgeHttpsPort value must be
# kept in sync with this one (used there only to compute frontend.origin for
# OIDC redirects — that chart has no way to read this chart's values
# directly, since both are independent top-level charts).
httpsPort: 8443

service:
  type: ClusterIP
  # Only used when service.type: NodePort — leave null for Kubernetes to
  # pick a random nodePort.
  httpNodePort: null
  httpsNodePort: null

# Each entry becomes its own route regardless of edgeType (a Caddy site
# block for "internal", a Tailscale Ingress for "tailscale"):
# <subdomain>.<global.appDomain> (internal) or <subdomain>.<tailnet>.ts.net
# (tailscale), reverse-proxied/forwarded to <targetService>:<targetPort>
# (bare Service name — this chart must be installed into the same namespace
# as everything it routes to). albSubdomain is a separate naming convention
# used only by edgeType: alb's Ingress (templates/alb-ingress.yaml) against
# a customer-supplied domain — kept independent of subdomain above so
# renaming one doesn't silently rename the other (internal/tailscale keep
# their own conventions unchanged).
routes:
  - name: frontend
    subdomain: app
    albSubdomain: straiker
    targetService: straiker-frontend-service
    targetPort: 80
  - name: defend-api
    subdomain: defend
    albSubdomain: straiker-defend
    targetService: straiker-defend
    targetPort: 80
  - name: ascend-api
    subdomain: ascend
    albSubdomain: straiker-ascend
    # charts/straiker-ascend's control-plane Service - matches its own
    # "ascend.externalUrl" helper default (https://ascend.<appDomain>:<port>),
    # used as SYS__DATA_EXFILTRATION_ENDPOINT's default.
    targetService: straiker-ascend-control-plane
    targetPort: 80
