apiVersion: v2
name: straiker-edge
description: >
  External exposure for a values-driven list of subdomain routes to
  in-cluster Services, via one of five edgeType modes: "none" (bring your
  own ingress/LoadBalancer — default), "internal" (Caddy, self-signed "tls
  internal" certs), "tailscale" (one Ingress per route, exposed through the
  Tailscale Kubernetes operator + Funnel), "alb" (one Ingress covering all
  routes via host-based rules, backed by a single internal AWS Application
  Load Balancer through the AWS Load Balancer Controller), or "xalb" (same
  as alb but internet-facing, sharing an ALB with other Ingresses on the
  cluster via IngressGroup, always backed by a real DNS-validated
  certificate). The "internal" mode was extracted from
  charts/straiker-core/charts/straiker-frontend's formerly-nested
  "internal-edge" component (frontend-only, one hardcoded route) into its
  own top-level chart once a second real consumer showed up
  (charts/straiker-defend's API), matching this repo's "small, independent
  charts" pattern (straiker-inference, straiker-artifact) over nesting a new
  subchart under straiker-core.
type: application
version: 0.5.0
appVersion: "2-alpine"
home: https://github.com/straiker-ai/onprem
sources:
  - https://github.com/straiker-ai/onprem
maintainers:
  - name: Straiker Team
    email: platform@straiker.ai
keywords:
  - straiker
  - edge
  - caddy
  - reverse-proxy
  - ingress
  - tailscale
