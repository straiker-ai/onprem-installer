# Straiker infra chart default values

# Shared across this chart and its subcharts (e.g. opensearch). When set, every
# component's image (which specify a relative repository, no registry host)
# resolves against this registry instead of its own default.
global:
  dockerRegistry: ""

cloudProvider: eks

clusterName: ""

# Karpenter
karpenter:
  gpu:
    nodePool:
      name: straiker-gpu
      # Matches Straiker's own production GPU NodePool convention — tighter
      # isolation than nodeSelector alone (which only steers where inference
      # pods land, not what else could land there). Anything scheduled onto a
      # GPU node (charts/straiker-inference's Deployment/DaemonSet) must
      # explicitly tolerate this.
      taints:
        - key: nvidia.com/gpu
          effect: NoSchedule
      labels:
        purpose: argus-model-workers
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
      disruption:
        consolidationPolicy: WhenEmpty
        consolidateAfter: 1h
      expireAfter: 720h
      limits:
        nvidia.com/gpu: "20"

  argus:
    nodePool:
      name: straiker-argus
      labels:
        purpose: straiker-argus
      taints:
        - key: purpose
          value: straiker-argus
          effect: NoSchedule
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["arm64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
      disruption:
        consolidationPolicy: WhenEmpty
        consolidateAfter: 30m
      expireAfter: 720h
      limits:
        cpu: "100"
        memory: 400Gi

  iris:
    nodePool:
      name: straiker-iris
      labels:
        purpose: straiker-iris
      taints:
        - key: purpose
          value: straiker-iris
          effect: NoSchedule
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["arm64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
      disruption:
        consolidationPolicy: WhenEmpty
        consolidateAfter: 30m
      expireAfter: 720h
      limits:
        cpu: "100"
        memory: 400Gi

  # Untainted, generic capacity for shared system services (opensearch,
  # postgres, redis — see sharedNodeSelector/opensearch.nodeSelector below).
  # Unlike gpu/argus/iris, no taints: these services carry no tolerations of
  # their own, so they can only ever land here.
  shared:
    nodePool:
      name: straiker-shared
      labels:
        purpose: general
      taints: []
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["arm64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
      disruption:
        consolidationPolicy: WhenEmpty
        consolidateAfter: 30m
      expireAfter: 720h
      limits:
        cpu: "50"
        memory: 200Gi

# Must match the plain "purpose" label key every NodePool in this chart sets
# (gpu/argus/iris/shared above) — not the "node.kubernetes.io/" prefixed form,
# which none of them actually carry, so opensearch could never match any of
# them (ours or a customer's own equivalent pool) with that prefix.
sharedNodeSelector: &sharedNodeSelector
  purpose: general

# EKS-specific configuration
eks:
  nodeRole: ""

  gpu:
    # g6e added for thanos's default GPU tier (L40S, 48GB — see
    # charts/straiker-inference's gpuProfiles) — verified against Straiker's
    # own production config, not just the older g5+bitsandbytes assumption.
    instanceFamilies: ["g4dn", "g5", "g6e"]
    nodeClass:
      name: straiker-gpu
      amiSelectorTerms:
        - alias: al2023@latest
      subnetSelectorTags: {}
      securityGroupSelectorTags: {}
      blockDeviceMappings:
        - deviceName: /dev/xvda
          ebs:
            volumeSize: 200Gi
            volumeType: gp3
            iops: 3000
            throughput: 125
            deleteOnTermination: true
      tags:
        purpose: argus-model-workers

  argus:
    instanceFamilies: ["m6g", "c6g", "m7g", "c7g"]
    instanceSizes: ["xlarge", "2xlarge", "4xlarge"]
    nodeClass:
      name: straiker-argus
      amiSelectorTerms:
        - alias: al2023@latest
      subnetSelectorTags: {}
      securityGroupSelectorTags: {}
      blockDeviceMappings:
        - deviceName: /dev/xvda
          ebs:
            volumeSize: 50Gi
            volumeType: gp3
            deleteOnTermination: true
      tags:
        purpose: straiker-argus

  iris:
    instanceFamilies: ["m6g", "c6g", "m7g", "c7g"]
    instanceSizes: ["xlarge", "2xlarge"]
    nodeClass:
      name: straiker-iris
      amiSelectorTerms:
        - alias: al2023@latest
      subnetSelectorTags: {}
      securityGroupSelectorTags: {}
      blockDeviceMappings:
        - deviceName: /dev/xvda
          ebs:
            volumeSize: 50Gi
            volumeType: gp3
            deleteOnTermination: true
      tags:
        purpose: straiker-iris

  shared:
    instanceFamilies: ["m6g", "c6g", "m7g", "c7g"]
    instanceSizes: ["large", "xlarge"]
    nodeClass:
      name: straiker-shared
      amiSelectorTerms:
        - alias: al2023@latest
      subnetSelectorTags: {}
      securityGroupSelectorTags: {}
      blockDeviceMappings:
        - deviceName: /dev/xvda
          ebs:
            volumeSize: 50Gi
            volumeType: gp3
            deleteOnTermination: true
      tags:
        purpose: straiker-shared

# GKE-specific configuration
gke:
  gpu:
    accelerators: ["nvidia-l4", "nvidia-tesla-t4"]
    nodeClass:
      name: straiker-gpu
      bootDiskSizeGB: 200
      bootDiskType: pd-ssd

  argus:
    machineFamilies: ["t2a"]
    nodeClass:
      name: straiker-argus
      bootDiskSizeGB: 50
      bootDiskType: pd-balanced

  iris:
    machineFamilies: ["t2a"]
    nodeClass:
      name: straiker-iris
      bootDiskSizeGB: 50
      bootDiskType: pd-balanced

  shared:
    machineFamilies: ["t2a"]
    nodeClass:
      name: straiker-shared
      bootDiskSizeGB: 50
      bootDiskType: pd-balanced

  # Filestore CSI
  filestore:
    enabled: false

    tier: standard
    network: default

    storageClass:
      name: filestore-sc
      reclaimPolicy: Retain

    modelsPvc:
      enabled: false
      name: models-filestore-pvc
      namespace: straiker
      size: 1Ti

# NVIDIA
nvidia:
  runtimeClass:
    enabled: true
    name: nvidia

  devicePlugin:
    enabled: true
    image:
      registry: nvcr.io
      repository: nvidia/k8s-device-plugin
      tag: v0.17.0
      pullPolicy: IfNotPresent
    failOnInitError: "false"
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

# EFS CSI StorageClasses
efs:
  enabled: false

  fileSystemId: ""

  storageClass:
    name: efs-sc
    reclaimPolicy: Retain
    volumeBindingMode: Immediate

  modelsPvc: null

# Shared stateful infra
tags:
  opensearch: true

# OpenSearch
opensearch:
  replicas: 1

  singleNode: true

  image:
    tag: "3.6.0"
    pullPolicy: IfNotPresent

  opensearchJavaOpts: "-Xms512m -Xmx512m"

  extraEnvs:
    - name: DISABLE_SECURITY_PLUGIN
      value: "true"
    - name: DISABLE_INSTALL_DEMO_CONFIG
      value: "true"

  persistence:
    enabled: true
    enableInitChown: false
    size: 10Gi
    storageClass: ""

  podSecurityContext:
    fsGroup: 1000

  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2
      memory: 2Gi

  nodeSelector: *sharedNodeSelector
  tolerations: []

# PostgreSQL
postgres:
  image:
    repository: library/postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  # The FIRST entry is the primary database — created directly by the base
  # postgres image itself via POSTGRES_USER/POSTGRES_DB env vars. Every other
  # entry is created by a generated initdb script (only runs once, on first
  # init of an empty PGDATA volume — same as the primary) and gets its own
  # generated Secret key (POSTGRES_PASSWORD_<NAME, uppercased>). Add a new
  # product's database here — no template changes needed. `extensions` is a
  # list of `CREATE EXTENSION IF NOT EXISTS <name>` statements run against
  # that database after creation; `password` optionally pins a password
  # instead of generating a random one.
  databases:
    - name: platform
      user: platform
    - name: iris
      user: iris
  # storageClassName has no safe default (postgres.yaml's `required` fails loudly
  # without one) — the installer always supplies it explicitly (the same
  # default/fallback StorageClass k8s-preflight resolves for opensearch).
  storage:
    storageClassName: ""
    size: 20Gi
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2
      memory: 4Gi

# Redis (actually Valkey — see readinessProbe/livenessProbe in redis.yaml —
# a Redis-protocol-compatible fork, mirrored by charts/straiker-artifact under
# this exact repository/tag). Enabled by default: unlike postgres, it needs no
# per-install config (no databases/users to provision), so there's no reason
# to make it opt-in.
redis:
  image:
    repository: valkey/valkey
    tag: "8-alpine"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
