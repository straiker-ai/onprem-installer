{{- if .Values.valkey }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  namespace: {{ include "infra.namespace" . }}
  labels:
    {{- include "infra.labels" . | nindent 4 }}
    app.kubernetes.io/component: valkey
spec:
  replicas: 1
  selector:
    matchLabels:
      app: valkey
  template:
    metadata:
      labels:
        app: valkey
    spec:
      nodeSelector:
        {{- toYaml .Values.sharedNodeSelector | nindent 8 }}
      containers:
        - name: valkey
          image: {{ include "infra.valkeyImage" . | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379
          resources:
            {{- toYaml .Values.valkey.resources | nindent 12 }}
          readinessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: {{ include "infra.namespace" . }}
  labels:
    {{- include "infra.labels" . | nindent 4 }}
    app.kubernetes.io/component: valkey
spec:
  type: ClusterIP
  selector:
    app: valkey
  ports:
    - name: valkey
      port: 6379
      targetPort: 6379
{{- end }}
