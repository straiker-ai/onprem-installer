{{- if .Values.nvidia.devicePlugin.enabled }}
{{- $dp := .Values.nvidia.devicePlugin }}
{{- $slices := int (($dp.timeSlicing | default dict).replicas | default 0) }}
{{- if gt $slices 1 }}
# TEST profile only (installer --inference-profile test): each GPU is advertised $slices times so several model servers can
# share it. Production never sets this: one server per GPU.
apiVersion: v1
kind: ConfigMap
metadata:
  name: straiker-nvidia-device-plugin-config
  namespace: kube-system
  labels:
    {{- include "base.labels" . | nindent 4 }}
data:
  config.yaml: |
    version: v1
    sharing:
      timeSlicing:
        resources:
          - name: nvidia.com/gpu
            replicas: {{ $slices }}
---
{{- end }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: straiker-nvidia-device-plugin
  namespace: kube-system
  labels:
    {{- include "base.labels" . | nindent 4 }}
    app.kubernetes.io/component: nvidia-device-plugin
spec:
  selector:
    matchLabels:
      app: straiker-nvidia-device-plugin
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: straiker-nvidia-device-plugin
        app.kubernetes.io/component: nvidia-device-plugin
      {{- if gt $slices 1 }}
      annotations:
        straiker.ai/time-slicing-replicas: {{ $slices | quote }} # a changed value restarts the plugin so nodes re-advertise
      {{- end }}
    spec:
      priorityClassName: system-node-critical

      nodeSelector:
        purpose: argus-model-workers
      # Karpenter's straiker-gpu NodeClass applies nvidia.com/gpu:NoSchedule
      # to keep non-GPU pods off these (expensive) nodes until the device
      # plugin has actually registered nvidia.com/gpu as allocatable — but
      # that means this DaemonSet itself needs to tolerate it too, or it can
      # never schedule there to do that registration in the first place,
      # leaving every GPU pod stuck Pending indefinitely (nodeSelector alone
      # doesn't get a pod past an untolerated taint).
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: nvidia-device-plugin
          image: {{ include "infra.image" (dict "image" $dp.image "global" .Values.global) | quote }}
          imagePullPolicy: {{ $dp.image.pullPolicy }}
          env:
            - name: FAIL_ON_INIT_ERROR
              value: {{ $dp.failOnInitError | quote }}
            {{- if gt $slices 1 }}
            - name: CONFIG_FILE
              value: /config/config.yaml
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml $dp.resources | nindent 12 }}
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
            {{- if gt $slices 1 }}
            - name: config
              mountPath: /config
            {{- end }}

      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
        {{- if gt $slices 1 }}
        - name: config
          configMap:
            name: straiker-nvidia-device-plugin-config
        {{- end }}
{{- end }}
