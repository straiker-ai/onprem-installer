{{- if .Values.redis }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: straiker-redis
  namespace: {{ include "infra.namespace" . }}
  labels:
    {{- include "infra.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: straiker-redis
  template:
    metadata:
      labels:
        app: straiker-redis
    spec:
      nodeSelector:
        purpose: straiker-shared
      containers:
        - name: redis
          image: {{ include "infra.redisImage" . | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          readinessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: straiker-redis
  namespace: {{ include "infra.namespace" . }}
  labels:
    {{- include "infra.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  selector:
    app: straiker-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
{{- end }}
