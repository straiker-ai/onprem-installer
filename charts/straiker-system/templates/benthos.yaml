{{- if .Values.benthos }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: straiker-benthos-pipeline
  namespace: {{ include "infra.namespace" . }}
  labels:
    {{- include "infra.labels" . | nindent 4 }}
    app.kubernetes.io/component: benthos
data:
  archive-pipeline.yaml: |
    http:
      address: 0.0.0.0:4195
      enabled: true

    metrics:
      prometheus: {}

    input:
      http_server:
        path: /archive
        allowed_verbs:
          - POST

    buffer:
      memory:
        limit: 100000000
        batch_policy:
          enabled: true
          count: 50
          period: 5s

    # Routes each record to the OpenSearch index named by its own "stream"
    # field (e.g. producers send stream: turns / turns-flagged /
    # turns-insights, or iris) — one output handles any stream name a
    # producer sends, rather than a fixed fan_out branch per known stream
    # that would need updating every time a new one's added.
    # "elasticsearch" is not a real output component in redpanda-connect
    # (verified against redpanda-data/connect's internal/impl at v4.101.0 —
    # it only registers elasticsearch_v8, elasticsearch_v9, and opensearch);
    # since the destination is actually OpenSearch, use that output
    # directly. Its "action" field has no default and is required.
    output:
      opensearch:
        urls: ["{{ include "infra.opensearchUrl" . }}"]
        index: '${! this.stream }'
        action: index
        id: '${! uuid_v4() }'

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: straiker-benthos
  namespace: {{ include "infra.namespace" . }}
  labels:
    {{- include "infra.labels" . | nindent 4 }}
    app.kubernetes.io/component: benthos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: straiker-benthos
  template:
    metadata:
      labels:
        app: straiker-benthos
    spec:
      nodeSelector:
        {{- toYaml .Values.sharedNodeSelector | nindent 8 }}
      containers:
        - name: benthos
          image: {{ include "infra.benthosImage" . | quote }}
          imagePullPolicy: {{ .Values.benthos.image.pullPolicy }}
          # args, not command — the image's own entrypoint is /redpanda-connect
          # (verified via `crane config redpandadata/connect:4.101.0`); setting
          # this as `command` replaces that entrypoint entirely and tries to
          # exec a literal binary named "run", which doesn't exist.
          args: ["run", "/etc/redpanda-connect/archive-pipeline.yaml"]
          ports:
            - containerPort: 4195
          resources:
            {{- toYaml .Values.benthos.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /ping
              port: 4195
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /ping
              port: 4195
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: pipeline-config
              mountPath: /etc/redpanda-connect
              readOnly: true
      volumes:
        - name: pipeline-config
          configMap:
            name: straiker-benthos-pipeline

---
apiVersion: v1
kind: Service
metadata:
  name: straiker-benthos
  namespace: {{ include "infra.namespace" . }}
  labels:
    {{- include "infra.labels" . | nindent 4 }}
    app.kubernetes.io/component: benthos
spec:
  type: ClusterIP
  selector:
    app: straiker-benthos
  ports:
    - name: http
      port: 4195
      targetPort: 4195
      protocol: TCP
{{- end }}
