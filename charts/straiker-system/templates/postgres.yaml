{{- if .Values.postgres }}
{{- $secretName := .Values.postgres.existingSecret | default "straiker-postgres-secret" }}
{{- $irisPassword := "" }}
{{- $platformPassword := "" }}
{{- if not .Values.postgres.existingSecret }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "straiker-postgres-secret" }}
{{- if $existing }}
  {{- $platformPassword = index $existing.data "POSTGRES_PASSWORD_PLATFORM" | b64dec }}
  {{- $irisPassword = index $existing.data "POSTGRES_PASSWORD_IRIS" | b64dec }}
{{- else }}
  {{- $platformPassword = .Values.postgres.platform.password | default (randAlphaNum 32) }}
  {{- $irisPassword = .Values.postgres.iris.password | default (randAlphaNum 32) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: straiker-postgres-secret
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "infra.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
type: Opaque
stringData:
  POSTGRES_PASSWORD_IRIS: {{ $irisPassword | quote }}
  POSTGRES_PASSWORD_PLATFORM: {{ $platformPassword | quote }}
---
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: straiker-postgres-initdb
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "infra.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
data:
  init-iris.sh: |
    #!/bin/bash
    set -e
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
      SET password_encryption = 'scram-sha-256';
      CREATE USER "${POSTGRES_USER_IRIS}" WITH PASSWORD '${POSTGRES_PASSWORD_IRIS}';
      CREATE DATABASE "${POSTGRES_DB_IRIS}" WITH OWNER "${POSTGRES_USER_IRIS}";
    EOSQL
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "${POSTGRES_DB_IRIS}" <<-EOSQL
      CREATE EXTENSION IF NOT EXISTS vector;
    EOSQL
---
apiVersion: v1
kind: Service
metadata:
  name: straiker-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "infra.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  selector:
    app: straiker-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: straiker-postgres
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "infra.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: straiker-postgres
  replicas: 1
  selector:
    matchLabels:
      app: straiker-postgres
  template:
    metadata:
      labels:
        app: straiker-postgres
    spec:
      nodeSelector:
        {{- toYaml .Values.sharedNodeSelector | nindent 8 }}
      containers:
        - name: postgres
          image: {{ include "infra.image" (dict "image" .Values.postgres.image "global" .Values.global) | quote }}
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres.platform.user | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.platform.database | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: POSTGRES_PASSWORD_PLATFORM
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_USER_IRIS
              value: {{ .Values.postgres.iris.user | quote }}
            - name: POSTGRES_DB_IRIS
              value: {{ .Values.postgres.iris.database | quote }}
            - name: POSTGRES_PASSWORD_IRIS
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: POSTGRES_PASSWORD_IRIS
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.platform.user | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.platform.user | quote }}]
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: initdb
          configMap:
            name: straiker-postgres-initdb
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ required "postgres.storage.storageClassName is required when postgres.enabled=true" .Values.postgres.storage.storageClassName | quote }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage.size }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: straiker-postgres-sync-passwords
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 5
  activeDeadlineSeconds: 120
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: straiker-postgres-sync-passwords
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        {{- toYaml .Values.sharedNodeSelector | nindent 8 }}
      containers:
        - name: sync-passwords
          image: {{ include "infra.image" (dict "image" .Values.postgres.image "global" .Values.global) | quote }}
          command:
            - sh
            - -c
            - |
              until pg_isready -h straiker-postgres.{{ .Release.Namespace }}.svc.cluster.local -U "$POSTGRES_USER"; do
                echo "waiting for postgres..."; sleep 3
              done
              psql -v ON_ERROR_STOP=1 \
                -h straiker-postgres.{{ .Release.Namespace }}.svc.cluster.local \
                -U "$POSTGRES_USER" -d "$POSTGRES_DB" <<-SQL
                  SET password_encryption = 'scram-sha-256';
                  ALTER USER "$POSTGRES_USER" PASSWORD '$POSTGRES_PASSWORD';
                  ALTER USER "$POSTGRES_USER_IRIS" PASSWORD '$POSTGRES_PASSWORD_IRIS';
              SQL
              echo "passwords synced"
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: straiker-postgres-secret
                  key: POSTGRES_PASSWORD_PLATFORM
            - name: POSTGRES_USER
              value: {{ .Values.postgres.platform.user | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.platform.database | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: straiker-postgres-secret
                  key: POSTGRES_PASSWORD_PLATFORM
            - name: POSTGRES_USER_IRIS
              value: {{ .Values.postgres.iris.user | quote }}
            - name: POSTGRES_PASSWORD_IRIS
              valueFrom:
                secretKeyRef:
                  name: straiker-postgres-secret
                  key: POSTGRES_PASSWORD_IRIS
{{- end }}
