{{- if and .Values.karpenter.gpu (eq .Values.cloudProvider "gke") }}

{{- if not (lookup "apiextensions.k8s.io/v1" "CustomResourceDefinition" "" "nodepools.karpenter.sh") }}
  {{- fail "Karpenter is not installed: CRD 'nodepools.karpenter.sh' not found.\nInstall Karpenter first, then re-run this chart.\nSee: https://cloud.google.com/kubernetes-engine/docs/concepts/karpenter" }}
{{- end }}
{{- if not (lookup "apiextensions.k8s.io/v1" "CustomResourceDefinition" "" "gkenodeclasses.karpenter.k8s.gke.io") }}
  {{- fail "GKE Karpenter CRD 'gkenodeclasses.karpenter.k8s.gke.io' not found.\nEnsure the Karpenter add-on is enabled on your GKE cluster (requires GKE 1.30+)." }}
{{- end }}

{{- $gpu := .Values.karpenter.gpu }}
{{- $gke := .Values.gke }}
{{- $nc  := $gke.gpu.nodeClass }}

{{- include "infra.karpenterNodePool" (dict
      "root" $
      "pool" $gpu.nodePool
      "nodeClassGroup" "karpenter.k8s.gke.io"
      "nodeClassKind" "GCENodeClass"
      "nodeClassName" $nc.name
      "extraRequirements" (list
        (dict "key" "karpenter.k8s.gke.io/accelerator" "operator" "In" "values" $gke.gpu.accelerators)
      )
    ) }}

---
apiVersion: karpenter.k8s.gke.io/v1
kind: GCENodeClass
metadata:
  name: {{ $nc.name }}
  labels:
    {{- include "base.labels" . | nindent 4 }}
spec:
  bootDiskSizeGB: {{ $nc.bootDiskSizeGB }}
  bootDiskType: {{ $nc.bootDiskType }}

{{- end }}
