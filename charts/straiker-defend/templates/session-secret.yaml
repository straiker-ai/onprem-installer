{{- $secretName := include "defend.sessionSecretName" . }}
{{- $existing := lookup "v1" "Secret" (include "defend.namespace" .) $secretName }}
{{- $sessionKey := "" }}
{{- if .Values.sessionKeySecret }}
  {{- /* Source of truth: Secret .Values.sessionKeySecret (ESO-synced from Secrets Manager). */ -}}
  {{- $src := lookup "v1" "Secret" (include "defend.namespace" .) .Values.sessionKeySecret }}
  {{- if not (and $src $src.data (index $src.data "SYS__ARGUS_SESSION_SECRET_KEY")) }}
    {{- fail (printf "Secret %q has no key SYS__ARGUS_SESSION_SECRET_KEY. Run phase 'straiker-defend' (it syncs it from Secrets Manager through External Secrets), or set sessionKeySecret=\"\" to generate it in-cluster." .Values.sessionKeySecret) }}
  {{- end }}
  {{- $sessionKey = index $src.data "SYS__ARGUS_SESSION_SECRET_KEY" | b64dec }}
{{- else if $existing }}
  {{- $sessionKey = index $existing.data "SYS__ARGUS_SESSION_SECRET_KEY" | b64dec }}
{{- else }}
  {{- $sessionKey = randAlphaNum 64 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ include "defend.namespace" . }}
  labels:
    {{- include "defend.labels" . | nindent 4 }}
  annotations:
    # Preserve across helm uninstall — rotating this key invalidates every
    # logged-in user session.
    helm.sh/resource-policy: keep
type: Opaque
data:
  SYS__ARGUS_SESSION_SECRET_KEY: {{ $sessionKey | b64enc | quote }}
