{{- /*
  No Secret is created by this chart for customer credentials.
  The pod reads required keys from "straiker-secrets" via envFrom — create it
  before installing this chart. Required keys:
    SYS__INFERENCE_API_KEY      — must match VLLM_API_KEY in charts/straiker-inference
    SYS__FOUNDATION_API_KEY     — sent verbatim as the Authorization header to
                                  straiker-frontend (no "Bearer " prefix added
                                  by argus); set it to "Bearer <value>" here.
    SYS__INTERNAL_ARGUS_API_KEY — argus verifies "Authorization: Bearer <value>";
                                  currently unused by this chart (no route here
                                  is wired to it yet - it exists on argus's own
                                  side for a narrow attachment-download route).
    ARGUS_SERVICE_API_KEY       — the real iris (Ascend) -> argus mechanism:
                                  argus's /api/v1/detect accepts this as a
                                  service-to-service key with no real per-app
                                  tenant record (settings.argus_service_api_key
                                  on argus's side, wired here as
                                  SYS__ARGUS_SERVICE_API_KEY). charts/
                                  straiker-ascend's probe-worker/recon-worker
                                  read this SAME key as SYS__ARGUS_API_KEY -
                                  both charts must reference the identical
                                  value. Optional: unset means argus falls
                                  through to normal per-tenant auth (401
                                  without a real tenant key).

  The session signing key (SYS__ARGUS_SESSION_SECRET_KEY) is auto-generated by
  this chart and stored in "straiker-defend-session-secret" instead — see
  session-secret.yaml. It's preserved across helm upgrades.
*/ -}}
