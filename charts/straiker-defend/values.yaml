# global.dockerRegistry: same convention as every other chart in this repo —
# when set, argus's image (relative repository, no registry host) resolves
# against this instead of pulling directly from Straiker's own registry.
global:
  dockerRegistry: ""

imagePullSecrets: []

replicas: 1

# Argus is the detection *frontend* — it runs no models itself, it fans out to
# charts/straiker-inference's per-model Services and blocks on them (see
# llmEndpoints below, and CUSTOMER__RUNTIME__IO_TIMEOUT). That request path is
# I/O-bound, so the CPU request is sized for steady state, not peak: bursts are
# absorbed by node headroom, since no cpu limit is set (deliberate — a limit
# here would mean CFS throttling on exactly the latency-sensitive path).
#
# 300m replaces an unmeasured 500m carried over from prior on-prem defaults.
# The 500m was above steady-state need and, combined with settingsSync's own
# request, could exhaust allocatable CPU on 2-vCPU shared-pool nodes once a
# customer DaemonSet (e.g. GuardDuty's 200m) joined — leaving argus unable to
# schedule at all.
#
# Raise this for high-QPS installs, or enable the hpa below. Setting
# limits.cpu is supported but off by default.
resources:
  requests:
    cpu: "300m"
    memory: "3Gi"
  limits:
    # cpu: omitted by default — see above. Set to enable a hard CPU ceiling.
    memory: "6Gi"

image:
  repository: straiker/argus
  tag: onprem-v2026.8.24
  pullPolicy: IfNotPresent

nodeSelector: {}
tolerations: []

serviceAccountName: straiker-defend
# GKE only — terraform/gcp/artifacts' workload_service_account_email output.
# Leave empty on EKS (Pod Identity needs no such annotation).
gcpServiceAccountEmail: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  # Only useful when service.type is LoadBalancer (e.g. edgeType: none
  # customers exposing this directly via the AWS Load Balancer Controller
  # instead of their own ingress) — e.g. aws-load-balancer-type/-scheme/
  # -nlb-target-type/load-balancer-source-ranges. Empty/no-op otherwise.
  annotations: {}

hpa:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 60

pdb:
  enabled: true
  minAvailable: 1

# Settings-synchronizer daemon — a single always-on replica that pulls
# tenant/app/API-key/settings from Foundation (straiker-frontend) into Redis.
# Should be on for every on-prem install (matches straiker-platform-old's own
# default); docker-compose profile-gates the equivalent service purely for
# local-dev convenience (skip the extra process when you're not testing
# settings sync specifically), not a signal to disable it here.
settingsSync:
  enabled: true

  # A single-replica polling daemon (argus.daemons.settings_synchronizer) that
  # pulls settings from Foundation into Redis — not on any request path. These
  # were previously hardcoded in settings-sync-deployment.yaml at 500m/1Gi,
  # i.e. the same CPU request as the main detection service and unreachable by
  # --values. Sized down to match what the daemon actually does.
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      memory: "512Mi"

foundation:
  # Foundation (tenant/app/settings control plane) is straiker-frontend in
  # this repo's architecture (straiker-platform-old's separate
  # straiker-control component doesn't exist here). Empty auto-derives to
  # straiker-frontend-service in this same namespace.
  endpoint: ""

# Redis — reuses charts/straiker-system's own instance (service "valkey", a
# Redis-protocol-compatible fork, this same namespace) rather than deploying
# a second one just for argus, unlike straiker-platform-old's per-app
# inClusterRedis.
redis:
  url: ""

# Archive pipeline: argus posts detection turns over HTTP to
# charts/straiker-system's single shared Redpanda Connect (Benthos) instance,
# which indexes them into that same chart's OpenSearch. One Benthos serves
# every product that archives turns (not just defend/argus), so it's
# infra-owned rather than deployed per-product here. Replaces
# straiker-platform-old's Kafka-bootstrap-server-based archiving
# (SYS__ARCHIVE_KAFKA_BOOTSTRAP_SERVERS), which assumed a full separate
# Redpanda broker cluster in a shared infra namespace that this installer
# doesn't provision — matches the lighter HTTP-based design already in
# ~/argus/onprem/docker-compose.yml, just pointed at OpenSearch instead of
# that file's local-disk file outputs (fine for docker-compose smoke testing,
# not for a real on-prem install).
archive:
  enabled: true
  streamTurns: turns
  streamTurnsFlagged: turns-flagged
  streamTurnsInsights: turns-insights
  timeoutSeconds: 5
  # Defaults to charts/straiker-system's own Redpanda Connect service, in
  # this same namespace.
  endpoint: ""

# CUSTOMER__ vars are policy/business config, not infra — left unset by
# default (straiker-platform-old's reference chart baked in one specific
# customer's category-detection thresholds; a generic on-prem chart
# shouldn't assume any customer's policy). Set via --set/-f per install.
customerSettings:
  ioTimeoutSeconds: "30.0"
  categorySettings: ""

logging:
  level: INFO
  renderer: console

# Karpenter scheduling — targets charts/straiker-system's shared, untainted
# NodePool (opensearch/postgres/redis land here too) rather than a dedicated
# per-service pool, so no toleration is needed. Set false only if this
# cluster has no such NodePool at all (pods get no nodeSelector then).
karpenter:
  enabled: true

# LLM inference endpoints — maps each of argus's SYS__LLM_ENDPOINTS__* keys to
# one of charts/straiker-inference's per-model Services (inference-<model>,
# this same namespace, port 8000). Matches straiker-platform-old's own
# model-to-endpoint assignment (LLM_STOCK and LAVA both point at hulk there
# too — not a typo carried over, that's what the reference chart did).
llmEndpoints:
  llama:
    model: antman
    path: /v1/completions
  internlm:
    model: quicksilver
    path: /v1/completions
  qwen:
    model: thor
    path: /v1/completions
  llmStock:
    model: hulk
    path: /v1/chat/completions
  lava:
    model: hulk
    path: /v1/chat/completions
  vision:
    model: vision
    path: /v1/chat/completions
  imageDetection:
    model: wanda
    path: /v1/chat/completions

# Bifrost LLM gateway (charts/straiker-core/charts/straiker-bifrost) — same
# namespace, deployed as part of the straiker-core release. Only consumed by
# argus when frontier.enabled is true below; empty baseUrl auto-derives to
# that chart's own Service in this same namespace. apiKey is a Bifrost
# virtual/attribution key (Bifrost doesn't reject unrecognized keys), not a
# rotated credential — safe as a plain value rather than a straiker-secrets
# entry.
bifrost:
  baseUrl: ""
  apiKey: "sk-bf-argus"

# Frontier second-opinion for adaptive IPI (POC) — see argus's own
# ipi_frontier.py. Off by default. Enabling this on-prem also requires
# straiker-core's straiker-bifrost subchart to be installed with a real
# Bedrock and/or Anthropic provider configured (argus has no AWS credentials
# of its own in this chart) — otherwise the check always fails safe (keeps
# the fine-tuned verdict) and never actually overturns anything.
frontier:
  enabled: false
