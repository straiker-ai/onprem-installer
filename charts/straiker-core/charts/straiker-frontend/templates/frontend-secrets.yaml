{{- /*
Chart-managed secret for frontend auth.

  SESSION_SIGNING_KEY — random 64-char alphanumeric, signs local JWT session
                        cookies. Generated on first install and preserved
                        across `helm upgrade` via `lookup`. Rotating this
                        value invalidates every active session.

Admin-bootstrap seeding (docker-compose's "bootstrap" service — seeds the
initial tenant + admin user) is deferred — this chart doesn't seed one yet.
*/ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "frontend.authSecretName" .) -}}
{{- $sessionKey := "" -}}
{{- /* Source of truth when set: Secret .Values.sessionKeySecret (ESO-synced from Secrets Manager). */ -}}
{{- if .Values.sessionKeySecret -}}
{{-   $src := lookup "v1" "Secret" .Release.Namespace .Values.sessionKeySecret -}}
{{-   if not (and $src $src.data (index $src.data "SESSION_SIGNING_KEY")) -}}
{{-     fail (printf "Secret %q has no key SESSION_SIGNING_KEY. Run phase 'straiker-core' (it syncs it from Secrets Manager through External Secrets), or set sessionKeySecret=\"\" to generate it in-cluster." .Values.sessionKeySecret) -}}
{{-   end -}}
{{-   $sessionKey = index $src.data "SESSION_SIGNING_KEY" -}}
{{- else if and $existing (index $existing.data "SESSION_SIGNING_KEY") -}}
{{-   $sessionKey = index $existing.data "SESSION_SIGNING_KEY" -}}
{{- else -}}
{{-   $sessionKey = randAlphaNum 64 | b64enc -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "frontend.authSecretName" . }}
  namespace: {{ include "frontend.namespace" . }}
  labels:
    {{- include "frontend.labels" . | nindent 4 }}
  annotations:
    # pre-install/pre-upgrade so the secret exists before the migrate Job runs.
    # Negative weight orders this BEFORE the migrate Job (weight 0).
    # before-hook-creation lets `lookup` above read the existing secret at
    # render time before Helm replaces it — that's how the value is preserved
    # across upgrades.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
data:
  SESSION_SIGNING_KEY: {{ $sessionKey }}
