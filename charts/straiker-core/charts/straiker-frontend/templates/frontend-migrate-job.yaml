{{- if .Values.frontend.dbMigrate.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: frontend-migrate
  namespace: {{ include "frontend.namespace" . }}
  labels:
    {{- include "frontend.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.frontend.dbMigrate.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.frontend.dbMigrate.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ .Values.frontend.dbMigrate.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        app: frontend-migrate
    spec:
      restartPolicy: OnFailure
      {{- with .Values.frontend.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "frontend.migrateImage" . | quote }}
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          resources:
            {{- toYaml .Values.frontend.dbMigrate.resources | nindent 12 }}
          env:
            # ── Liquibase ───────────────────────────────────────
            - name: LIQUIBASE_COMMAND_CHANGELOG_FILE
              value: "master.json"
            - name: LIQUIBASE_SEARCH_PATH
              value: "/liquibase/changelog"
            - name: LIQUIBASE_COMMAND_URL
              value: {{ printf "jdbc:postgresql://%s:%v/%s?sslmode=%s" (include "frontend.dbHost" .) .Values.frontend.db.port (required "frontend.db.name is required" .Values.frontend.db.name) .Values.frontend.db.sslMode | quote }}
            - name: LIQUIBASE_COMMAND_USERNAME
              value: {{ required "frontend.db.user is required" .Values.frontend.db.user | quote }}
            - name: LIQUIBASE_COMMAND_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "frontend.dbPasswordSecretName" . }}
                  key: {{ include "frontend.dbPasswordSecretKey" . }}
      nodeSelector:
        {{- include "frontend.nodeSelector" . | nindent 8 }}
      {{- with .Values.frontend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
