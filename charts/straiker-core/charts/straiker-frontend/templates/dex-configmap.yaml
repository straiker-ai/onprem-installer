{{- if .Values.dex.enabled }}
{{- $origin := include "frontend.origin" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: dex-config
  namespace: {{ include "dex.namespace" . }}
  labels:
    {{- include "dex.labels" . | nindent 4 }}
data:
  # Disposable local OIDC provider, backed by its own builtin password-DB
  # connector (no separate LDAP directory) — bundled so a fresh install has
  # working login without a customer-supplied IdP on day one. Enterprise
  # customers replace this entirely by pointing frontend's OIDC_* values at
  # their own IdP; dex is never a permanent identity store. Proxied through
  # the frontend app itself (/dex/*, see dex-proxy.ts) rather than published
  # on its own host, so `issuer` is the public frontend origin plus /dex, not
  # an in-cluster address. staticClients.secret below is a plain demo
  # credential (matching ~/straiker/frontend/onprem/docker-compose.yaml's own
  # hardcoded value) — override .Values.dex.staticClient.secret for anything
  # beyond quick testing.
  config.yaml: |
    issuer: {{ printf "%s/dex" $origin }}

    storage:
      type: sqlite3
      config:
        file: /var/dex/dex.db

    web:
      http: 0.0.0.0:{{ .Values.dex.service.port }}

    oauth2:
      skipApprovalScreen: true
      responseTypes:
        - code

    staticClients:
      - id: {{ .Values.dex.staticClient.id | quote }}
        secret: {{ .Values.dex.staticClient.secret | quote }}
        name: 'Straiker'
        redirectURIs:
          - {{ printf "%s/login/oidc/callback" $origin | quote }}
          - {{ printf "%s/login/oidc/callback" ($origin | replace "https://" "http://") | quote }}
          # Always-on Dex fallback flow (see login/+page.server.ts in the
          # frontend app), reachable even once a customer points OIDC_ISSUER
          # at their own IdP above.
          - {{ printf "%s/login/oidc/dex/callback" $origin | quote }}
          - {{ printf "%s/login/oidc/dex/callback" ($origin | replace "https://" "http://") | quote }}

    # Local login is backed by Dex's own builtin password-DB connector — the
    # frontend app's dex-users.ts manages entries in it dynamically via Dex's
    # gRPC API (see dex-deployment.yaml's --grpc-addr/DEX_API_CONNECTORS_CRUD).
    enablePasswordDB: true
    {{- if .Values.dex.staticAdminEnabled }}
    staticPasswords:
      # Default disposable admin login (admin@straiker.internal, fixed —
      # see frontend.bootstrapAdminEmail's own comment for why) — matches
      # frontend.bootstrapAdminEmail's default exactly (see
      # frontend.bootstrapAdminEmail in _helpers.tpl), or first login won't
      # match the bootstrapped admin row. hash is a per-install random
      # password's bcrypt digest, generated by install-straiker.sh's
      # phase_shared_secrets and passed in via --set-string — set
      # dex.staticAdminEnabled: false once a real admin has been onboarded
      # (see that value's own comment).
      - email: {{ include "frontend.bootstrapAdminEmail" . | quote }}
        hash: {{ required "dex.staticAdminPasswordHash is required when dex.staticAdminEnabled is true — install-straiker.sh's phase_shared_secrets generates and supplies this automatically" .Values.dex.staticAdminPasswordHash | quote }}
        username: admin
        userID: {{ include "frontend.bootstrapAdminEmail" . | quote }}
    {{- end }}
{{- end }}
