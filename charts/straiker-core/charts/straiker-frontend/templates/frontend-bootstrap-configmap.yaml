{{- if .Values.frontend.bootstrap.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-bootstrap
  namespace: {{ include "frontend.namespace" . }}
  labels:
    {{- include "frontend.labels" . | nindent 4 }}
    app.kubernetes.io/component: bootstrap
  annotations:
    # Must be a hook too, not a plain resource — plain resources are applied
    # in a separate phase strictly AFTER all hooks, so the frontend-bootstrap
    # Job (itself a hook) would find this ConfigMap missing otherwise. Same
    # weight as frontend-migrate — Helm waits for that whole weight-0 tier
    # (including migrate's own completion) before advancing to bootstrap's
    # weight-1 tier, so this is guaranteed to exist by then either way.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
  # Verbatim copy of ~/straiker/frontend/onprem/bootstrap.sql — idempotent,
  # seeds the initial tenant + admin user row via psql -v substitution.
  bootstrap.sql: |
    -- Idempotent bootstrap: seeds the initial tenant and admin user.
    -- Run via:
    --   psql -v admin_email="..." -v customer_name="..." -f bootstrap.sql
    --
    -- OIDC (the bundled Dex/GLAuth IdP, or a customer's own IdP) is the only
    -- on-prem login path — there is no local password. This just pre-provisions
    -- the admin's email + role so their first OIDC login (whichever IdP returns
    -- a matching email) logs in as admin rather than being JIT-provisioned as a
    -- viewer.
    --
    -- If no admin email is provided, bootstrap falls back to admin@example.com so
    -- the default self-hosted tenant always gets a seeded admin account.

    INSERT INTO customers (name, disable_password_login)
    SELECT COALESCE(NULLIF(:'customer_name', ''), 'My Company'), false
    WHERE NOT EXISTS (SELECT 1 FROM customers);

    INSERT INTO onprem_users (email, straiker_id, role)
    SELECT
    	COALESCE(NULLIF(:'admin_email', ''), 'admin@example.com'),
    	id,
    	'admin'
    FROM customers
    LIMIT 1
    ON CONFLICT (email) DO UPDATE SET
    	straiker_id = EXCLUDED.straiker_id,
    	role = EXCLUDED.role;
{{- end }}
