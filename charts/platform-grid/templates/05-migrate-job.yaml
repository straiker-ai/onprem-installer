{{- if .Values.straiker.grid.migrations.enabled }}
{{- $m := .Values.straiker.grid.migrations }}
{{- if and $m.secretsManager.secretId $m.credentialsSecret.name }}
{{- fail "straiker.grid.migrations: set secretsManager.secretId OR credentialsSecret.name, not both" }}
{{- end }}
{{- if and $m.secretsManager.secretId (not $m.secretsManager.region) }}
{{- fail "straiker.grid.migrations.secretsManager.region is required with secretId" }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "straiker.name" . }}-migrate
  namespace: {{ .Release.Namespace }}
  labels:
    app.straiker.io/app: grid
    {{- include "straiker.labels" . | nindent 4 }}
  annotations:
    # Apply pending deploy/ch-goose migrations before the app is installed/upgraded,
    # so the schema is ready; re-run on every release (a no-op when nothing is
    # pending). The Job is cleaned up before the next hook fires and after it succeeds
    # (failed Jobs are kept for debugging).
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.straiker.grid.migrations.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.straiker.grid.migrations.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        app.straiker.io/app: grid
        {{- include "straiker.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ .Values.straiker.grid.serviceAccount.name }}
      {{- if .Values.straiker.grid.image.imagePullSecrets }}
      imagePullSecrets:
        {{- range .Values.straiker.grid.image.imagePullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      {{- if $m.replicatedEngines }}
      initContainers:
        - name: replicate-engines
          image: "{{ .Values.straiker.grid.migrations.image.registry }}/{{ .Values.straiker.grid.migrations.image.name }}:{{ .Values.straiker.grid.migrations.image.version }}"
          imagePullPolicy: {{ .Values.straiker.grid.migrations.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              cp /straiker/ch-goose/*.sql /work/
              for f in /work/*.sql; do
                sed -E -i 's/ENGINE[[:space:]]*=[[:space:]]*(Replacing|Aggregating|Summing|Collapsing|VersionedCollapsing)?MergeTree/ENGINE = Replicated\1MergeTree/g' "$f"
              done
          volumeMounts:
            - { name: ch-goose, mountPath: /work }
      {{- end }}
      containers:
        - name: migrate
          image: "{{ .Values.straiker.grid.migrations.image.registry }}/{{ .Values.straiker.grid.migrations.image.name }}:{{ .Values.straiker.grid.migrations.image.version }}"
          imagePullPolicy: {{ .Values.straiker.grid.migrations.image.pullPolicy }}
          args: ["up"]
          # GRID_CLICKHOUSE_ADDR / GRID_CLICKHOUSE_SECURE supply the endpoint; the DDL
          # credentials are GRID_CH_MIGRATE_USERNAME / GRID_CH_MIGRATE_PASSWORD, which
          # ch-migrate does NOT fall back from (the service user is read-only). They come
          # from Secrets Manager (secretsManager.secretId, read at start-up as the pod
          # identity), or a k8s Secret (credentialsSecret; explicit env wins over
          # envFrom), else from the platform-secret.
          envFrom:
            - secretRef:
                name: {{ .Values.straiker.grid.secretName }}
          env:
            {{- if $m.replicatedEngines }}
            - name: GRID_CH_MIGRATE_DIR
              value: /work
            {{- end }}
            - name: GRID_CLICKHOUSE_SECURE
              value: {{ .Values.straiker.grid.clickhouse.secure | quote }}
            {{- with .Values.straiker.grid.migrations.secretsManager }}
            {{- if .secretId }}
            - name: GRID_CH_MIGRATE_CREDENTIALS_SECRET
              value: {{ .secretId | quote }}
            - name: AWS_REGION
              value: {{ .region | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.straiker.grid.migrations.credentialsSecret }}
            {{- if .name }}
            - name: GRID_CH_MIGRATE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .name }}
                  key: {{ .usernameKey }}
            - name: GRID_CH_MIGRATE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .name }}
                  key: {{ .passwordKey }}
            {{- end }}
            {{- end }}
          {{- if $m.replicatedEngines }}
          volumeMounts:
            - { name: ch-goose, mountPath: /work }
          {{- end }}
      {{- if $m.replicatedEngines }}
      volumes:
        - { name: ch-goose, emptyDir: {} }
      {{- end }}
      {{- with .Values.straiker.grid.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.straiker.grid.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.straiker.grid.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
