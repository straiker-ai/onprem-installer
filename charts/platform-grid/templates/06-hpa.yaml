{{- if .Values.straiker.grid.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "straiker.name" . }}-hpa
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "straiker.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "straiker.name" . }}-deployment
  minReplicas: {{ .Values.straiker.grid.hpa.minReplicas }}
  maxReplicas: {{ .Values.straiker.grid.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.straiker.grid.hpa.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.straiker.grid.hpa.targetMemoryUtilizationPercentage }}
{{- end }}
