{{- /*
  No Secret is created by this chart.
  The pod optionally reads VLLM_API_KEY from "straiker-secrets" via envFrom
  (marked optional — vLLM just serves unauthenticated if it's absent, same
  graceful-degradation pattern as charts/straiker-core's bifrost). Create it
  once you want the inference endpoint to require a key:
    kubectl create secret generic straiker-secrets \
      -n <namespace> \
      --from-literal=VLLM_API_KEY=<key>
*/ -}}
