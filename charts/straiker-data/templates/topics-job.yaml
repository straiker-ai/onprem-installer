{{- if .Values.msk.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: straiker-data-msk-topics
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: {{ .Values.serviceAccount.name }}
      initContainers:
        - name: fetch-iam-auth-jar
          image: {{ .Values.images.curl }}
          command: ["curl", "-fsSL", "-o", "/jars/aws-msk-iam-auth-all.jar", {{ .Values.images.mskIamAuthJarUrl | quote }}]
          volumeMounts:
            - { name: jars, mountPath: /jars }
      containers:
        - name: create-topics
          image: {{ .Values.images.kafka }}
          env:
            # Pod Identity does not inject a region; the IAM login module needs one.
            - { name: AWS_REGION, value: {{ required "aws.region is required" .Values.aws.region | quote }} }
            - { name: BOOTSTRAP_BROKERS, value: {{ .Values.msk.bootstrapBrokers | quote }} }
          volumeMounts:
            - { name: jars, mountPath: /jars }
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              export CLASSPATH=/jars/aws-msk-iam-auth-all.jar
              cat >/tmp/client.properties <<'EOF2'
              security.protocol=SASL_SSL
              sasl.mechanism=AWS_MSK_IAM
              sasl.jaas.config=software.amazon.msk.auth.iam.IAMLoginModule required;
              sasl.client.callback.handler.class=software.amazon.msk.auth.iam.IAMClientCallbackHandler
              EOF2
              create_topic() {
                echo "=== $1 ==="
                kafka-topics --bootstrap-server "$BOOTSTRAP_BROKERS" --command-config /tmp/client.properties \
                  --create --if-not-exists --topic "$1" --partitions "$2" \
                  --replication-factor {{ .Values.msk.replicationFactor }} \
                  --config "retention.ms=$3" --config "cleanup.policy=$4" ${5:+--config "max.message.bytes=$5"}
              }
              {{- range .Values.msk.topics }}
              create_topic {{ .name | quote }} {{ .partitions }} {{ .retentionMs | int64 }} {{ .cleanupPolicy | default "delete" }}{{ if .maxMessageBytes }} {{ .maxMessageBytes | int64 }}{{ end }}
              {{- end }}
              kafka-topics --bootstrap-server "$BOOTSTRAP_BROKERS" --command-config /tmp/client.properties --list
      volumes:
        - { name: jars, emptyDir: {} }
{{- end }}
