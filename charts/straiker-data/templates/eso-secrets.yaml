{{- /*
ExternalSecret-built straiker-db-dsn and platform-secret (eso.enabled): every input is read from Secrets Manager
(<eso.smPrefix>/db/passwords, platform/keys, platform/api-gateway, platform/shared, clickhouse/credentials);
hosts, ports and user names are not secret and come from chart values. Mirrors the keys of dsn-secret.yaml.
eso.previewSuffix renders the same ExternalSecrets against "<name><suffix>" targets (installer dry run).
*/ -}}
{{- if and .Values.aurora.enabled .Values.eso.enabled }}
{{- $pfx := required "eso.smPrefix is required when eso.enabled" .Values.eso.smPrefix }}
{{- $o := "{{" }}
{{- $c := "}}" }}
{{- $preview := ne .Values.eso.previewSuffix "" }}
{{- $dbCluster := include "straiker-data.dbClusters" . | fromJson }}
{{- $names := list }}
{{- range $db, $cfg := .Values.databases }}{{ $names = append $names $db }}{{ end }}
{{- range $r, $_ := .Values.readers }}{{ $names = append $names $r }}{{ end }}

{{- /* Role passwords: aliases pw_<name> usable in the templates below. */ -}}
{{- $pwData := list }}
{{- range $n := $names }}
{{- $pwData = append $pwData (dict "secretKey" (printf "pw_%s" $n) "remoteRef" (dict "key" (printf "%s/db/passwords" $pfx) "property" $n)) }}
{{- end }}

{{- /* DSNs (same strings dsn-secret.yaml builds). */ -}}
{{- $dsns := dict }}
{{- range $db, $cfg := .Values.databases }}
{{- $cl := get $.Values.aurora.clusters (get $dbCluster $db) }}
{{- $_ := set $dsns $cfg.envKey (printf "postgres://%s:%s@%s:%v/%s?sslmode=require" $db (printf "%s .pw_%s %s" $o $db $c) $cl.host $cl.port $db) }}
{{- end }}

{{- /* straiker-db-dsn: PASSWORD_<name> + the DSNs. */ -}}
{{- $dsnTpl := dict }}
{{- range $k, $v := $dsns }}{{ $_ := set $dsnTpl $k $v }}{{ end }}
{{- range $n := $names }}{{ $_ := set $dsnTpl (printf "PASSWORD_%s" $n) (printf "%s .pw_%s %s" $o $n $c) }}{{ end }}
{{- $dsnName := printf "%s%s" .Values.dsnSecret .Values.eso.previewSuffix }}
{{- $store := dict "name" .Values.eso.store "kind" "ClusterSecretStore" }}
{{- $dsnES := dict "apiVersion" "external-secrets.io/v1beta1" "kind" "ExternalSecret"
      "metadata" (dict "name" $dsnName)
      "spec" (dict "refreshInterval" .Values.eso.refreshInterval "secretStoreRef" $store
        "target" (dict "name" $dsnName "creationPolicy" (ternary "Owner" .Values.eso.dsnCreationPolicy $preview) "deletionPolicy" "Retain"
          "template" (dict "engineVersion" "v2" "data" $dsnTpl))
        "data" $pwData) }}

{{- /* platform-secret: DSNs, bus brokers, S2S keys, portico key, ClickHouse. */ -}}
{{- $platTpl := dict }}
{{- range $k, $v := $dsns }}{{ $_ := set $platTpl $k $v }}{{ end }}
{{- range $k := list "DATABRIDGE" "NOTIFY" "REGISTRY" "FOUNDATION" }}{{ $_ := set $platTpl (printf "%s_BUS_BROKERS" $k) $.Values.msk.bootstrapBrokers }}{{ end }}
{{- $_ := set $platTpl "PLATFORM_INTERNAL_S2S_API_KEY" (printf "%s .s2s %s" $o $c) }}
{{- $_ := set $platTpl "FOUNDATION_PLATFORM_VALIDATE_KEY" (printf "%s .validate %s" $o $c) }}
{{- $_ := set $platTpl "REGISTRY_GATEWAY_S2S_KEY" (printf "%s .gwS2s %s" $o $c) }}
{{- $_ := set $platTpl "PORTICO_INTERNAL_API_KEY" (printf "%s .portico %s" $o $c) }}
{{- $platData := concat $pwData (list
      (dict "secretKey" "s2s" "remoteRef" (dict "key" (printf "%s/platform/keys" $pfx) "property" "PLATFORM_INTERNAL_S2S_API_KEY"))
      (dict "secretKey" "validate" "remoteRef" (dict "key" (printf "%s/platform/api-gateway" $pfx) "property" "PLATFORM_VALIDATE_KEY"))
      (dict "secretKey" "gwS2s" "remoteRef" (dict "key" (printf "%s/platform/api-gateway" $pfx) "property" "SYS__ARGUS_INTERNAL_S2S_KEY"))
      (dict "secretKey" "portico" "remoteRef" (dict "key" (printf "%s/platform/shared" $pfx) "property" "INTERNAL_API_KEY"))) }}
{{- with .Values.platform.clickhouse }}
{{- if .host }}
{{- $addr := printf "%s:%s" .host (toString .nativePort) }}
{{- $_ := set $platTpl "GRID_CLICKHOUSE_ADDR" $addr }}
{{- $_ := set $platTpl "GRID_CLICKHOUSE_USERNAME" "grid_query_ro" }}
{{- $_ := set $platTpl "GRID_CLICKHOUSE_PASSWORD" (printf "%s .ch_query %s" $o $c) }}
{{- $_ := set $platTpl "REGISTRY_CLICKHOUSE_ADDR" $addr }}
{{- $_ := set $platTpl "REGISTRY_CLICKHOUSE_USERNAME" "grid_query_ro" }}
{{- $_ := set $platTpl "REGISTRY_CLICKHOUSE_PASSWORD" (printf "%s .ch_query %s" $o $c) }}
{{- $_ := set $platTpl "REGISTRY_CLICKHOUSE_PURGE_USERNAME" "grid_purge" }}
{{- $_ := set $platTpl "REGISTRY_CLICKHOUSE_PURGE_PASSWORD" (printf "%s .ch_purge %s" $o $c) }}
{{- if .ddlHost }}
{{- $_ := set $platTpl "GRID_CH_MIGRATE_ADDR" (printf "%s:%s" .ddlHost (toString .nativePort)) }}
{{- end }}
{{- $_ := set $platTpl "GRID_CH_MIGRATE_USERNAME" "admin" }}
{{- $_ := set $platTpl "GRID_CH_MIGRATE_PASSWORD" (printf "%s .ch_admin %s" $o $c) }}
{{- $platData = concat $platData (list
      (dict "secretKey" "ch_query" "remoteRef" (dict "key" (printf "%s/clickhouse/credentials" $pfx) "property" "grid_query_ro"))
      (dict "secretKey" "ch_purge" "remoteRef" (dict "key" (printf "%s/clickhouse/credentials" $pfx) "property" "grid_purge"))
      (dict "secretKey" "ch_admin" "remoteRef" (dict "key" (printf "%s/clickhouse/credentials" $pfx) "property" "admin"))) }}
{{- end }}
{{- end }}
{{- $platName := printf "%s%s" .Values.platform.secretName .Values.eso.previewSuffix }}
{{- $platES := dict "apiVersion" "external-secrets.io/v1beta1" "kind" "ExternalSecret"
      "metadata" (dict "name" $platName)
      "spec" (dict "refreshInterval" .Values.eso.refreshInterval "secretStoreRef" $store
        "target" (dict "name" $platName "creationPolicy" (ternary "Owner" .Values.eso.platformCreationPolicy $preview) "deletionPolicy" "Retain"
          "template" (dict "engineVersion" "v2" "data" $platTpl))
        "data" $platData) }}
{{ toYaml $dsnES }}
---
{{ toYaml $platES }}
{{- end }}
