{{- if and .Values.aurora.enabled (not .Values.eso.enabled) }}
{{- /* Role passwords come from Secret .Values.passwordsSecret (ESO-synced from Secrets Manager, keys PASSWORD_<name>);
       empty passwordsSecret = legacy: generate once and keep across upgrades (looked up from the live Secret). */ -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace .Values.dsnSecret).data | default dict }}
{{- $source := dict }}
{{- if .Values.passwordsSecret }}
{{- $source = (lookup "v1" "Secret" .Release.Namespace .Values.passwordsSecret).data | default dict }}
{{- end }}
{{- $pws := dict }}
{{- $dsns := dict }}
{{- $dbCluster := include "straiker-data.dbClusters" . | fromJson }}
{{- $names := list }}
{{- range $db, $cfg := .Values.databases }}{{ $names = append $names $db }}{{ end }}
{{- range $r, $_ := .Values.readers }}{{ $names = append $names $r }}{{ end }}
{{- range $n := $names }}
{{- $pw := "" }}
{{- if $.Values.passwordsSecret }}
{{- if not (hasKey $source (printf "PASSWORD_%s" $n)) }}
{{- fail (printf "Secret %q has no key PASSWORD_%s. Run phase 'data-bootstrap' (it syncs it from Secrets Manager through External Secrets), or set passwordsSecret=\"\" to generate passwords in-cluster." $.Values.passwordsSecret $n) }}
{{- end }}
{{- $pw = index $source (printf "PASSWORD_%s" $n) | b64dec }}
{{- else if hasKey $existing (printf "PASSWORD_%s" $n) }}
{{- $pw = index $existing (printf "PASSWORD_%s" $n) | b64dec }}
{{- else }}
{{- $pw = randAlphaNum 32 }}
{{- end }}
{{- $_ := set $pws $n $pw }}
{{- end }}
{{- range $db, $cfg := .Values.databases }}
{{- $cl := get $.Values.aurora.clusters (get $dbCluster $db) }}
{{- $_ := set $dsns $cfg.envKey (printf "postgres://%s:%s@%s:%v/%s?sslmode=require" $db (get $pws $db) $cl.host $cl.port $db) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.dsnSecret }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
{{- range $db, $pw := $pws }}
  PASSWORD_{{ $db }}: {{ $pw | quote }}
{{- end }}
{{- range $k, $v := $dsns }}
  {{ $k }}: {{ $v | quote }}
{{- end }}
---
{{- $existingPlatform := (lookup "v1" "Secret" .Release.Namespace .Values.platform.secretName).data | default dict }}
{{- $shared := (lookup "v1" "Secret" .Release.Namespace .Values.platform.sharedSecretName).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.platform.secretName }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
{{- range $k, $v := $dsns }}
  {{ $k }}: {{ $v | quote }}
{{- end }}
{{- range $k := list "DATABRIDGE" "NOTIFY" "REGISTRY" "FOUNDATION" }}
  {{ $k }}_BUS_BROKERS: {{ $.Values.msk.bootstrapBrokers | quote }}
{{- end }}
{{- $given := dict "FOUNDATION_PLATFORM_VALIDATE_KEY" .Values.platform.validateKey "REGISTRY_GATEWAY_S2S_KEY" .Values.platform.gatewayS2SKey }}
{{- /* PLATFORM_INTERNAL_S2S_API_KEY: from Secret platform.keysSecret (ESO-synced from Secrets Manager) when set. */ -}}
{{- $keys := dict }}
{{- if .Values.platform.keysSecret }}
{{- $keys = (lookup "v1" "Secret" .Release.Namespace .Values.platform.keysSecret).data | default dict }}
{{- if not (hasKey $keys "PLATFORM_INTERNAL_S2S_API_KEY") }}
{{- fail (printf "Secret %q has no key PLATFORM_INTERNAL_S2S_API_KEY. Run phase 'data-bootstrap' (it syncs it from Secrets Manager through External Secrets), or set platform.keysSecret=\"\" to generate it in-cluster." .Values.platform.keysSecret) }}
{{- end }}
{{- end }}
{{- range $k := list "PLATFORM_INTERNAL_S2S_API_KEY" "FOUNDATION_PLATFORM_VALIDATE_KEY" "REGISTRY_GATEWAY_S2S_KEY" }}
  {{ $k }}: {{ if and (eq $k "PLATFORM_INTERNAL_S2S_API_KEY") $.Values.platform.keysSecret }}{{ index $keys $k | b64dec | quote }}{{ else if index $given $k }}{{ index $given $k | quote }}{{ else if hasKey $existingPlatform $k }}{{ index $existingPlatform $k | b64dec | quote }}{{ else }}{{ randAlphaNum 48 | quote }}{{ end }}
{{- end }}
{{- if hasKey $shared "INTERNAL_API_KEY" }}
  PORTICO_INTERNAL_API_KEY: {{ index $shared "INTERNAL_API_KEY" | b64dec | quote }}
{{- end }}
{{- /* ClickHouse (chart straiker-clickhouse, installed first); keys are omitted until its Secret exists — re-run data-bootstrap afterwards. */ -}}
{{- $ch := (lookup "v1" "Secret" .Release.Namespace .Values.platform.clickhouseSecret).data | default dict }}
{{- if hasKey $ch "host" }}
{{- $addr := printf "%s:%s" (index $ch "host" | b64dec) (index $ch "nativePort" | b64dec) }}
  GRID_CLICKHOUSE_ADDR: {{ $addr | quote }}
  GRID_CLICKHOUSE_USERNAME: {{ index $ch "grid_query_ro_username" | b64dec | quote }}
  GRID_CLICKHOUSE_PASSWORD: {{ index $ch "grid_query_ro_password" | b64dec | quote }}
  REGISTRY_CLICKHOUSE_ADDR: {{ $addr | quote }}
  REGISTRY_CLICKHOUSE_USERNAME: {{ index $ch "grid_query_ro_username" | b64dec | quote }}
  REGISTRY_CLICKHOUSE_PASSWORD: {{ index $ch "grid_query_ro_password" | b64dec | quote }}
  REGISTRY_CLICKHOUSE_PURGE_USERNAME: {{ index $ch "grid_purge_username" | b64dec | quote }}
  REGISTRY_CLICKHOUSE_PURGE_PASSWORD: {{ index $ch "grid_purge_password" | b64dec | quote }}
{{- if hasKey $ch "ddlHost" }}
  # Grid's ClickHouse migrations run on replica 0 only (DDL in a Replicated database is applied there first).
  GRID_CH_MIGRATE_ADDR: {{ printf "%s:%s" (index $ch "ddlHost" | b64dec) (index $ch "nativePort" | b64dec) | quote }}
{{- end }}
  GRID_CH_MIGRATE_USERNAME: {{ index $ch "admin_username" | b64dec | quote }}
  GRID_CH_MIGRATE_PASSWORD: {{ index $ch "admin_password" | b64dec | quote }}
{{- end }}
{{- end }}
