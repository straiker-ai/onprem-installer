apiVersion: apps/v1
kind: Deployment
{{- $otel := .Values.straiker.foundation.observability.otel }}
{{- $otelEnabled := $otel.enabled | default true }}
metadata:
  labels:
    app.straiker.io/app: foundation
    {{- include "straiker.labels" . | nindent 4 }}
  {{- with .Values.straiker.foundation.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  name: {{ include "straiker.name" . }}-deployment
  namespace: {{ .Release.Namespace }}
spec:
  {{- if not .Values.straiker.foundation.hpa.enabled }}
  # Omitted when the HPA owns this Deployment: a literal replicas here is
  # reapplied on every upgrade, so a release during a scale-out would snap the
  # count back to the values-file floor before the HPA could scale it up again.
  replicas: {{ .Values.straiker.foundation.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app.straiker.io/app: foundation
      {{- include "straiker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.straiker.io/app: foundation
        {{- include "straiker.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.straiker.foundation.serviceAccount.name }}
      {{- if .Values.straiker.foundation.image.imagePullSecrets }}
      imagePullSecrets:
        {{- range .Values.straiker.foundation.image.imagePullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      containers:
        - name: foundation
          ports:
            - name: http
              containerPort: {{ .Values.straiker.foundation.port }}
              protocol: TCP
          image: "{{ .Values.straiker.foundation.image.registry }}/{{ .Values.straiker.foundation.image.name }}:{{ .Values.straiker.foundation.image.version }}"
          imagePullPolicy: {{ .Values.straiker.foundation.image.pullPolicy }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          envFrom:
            - configMapRef:
                name: {{ include "straiker.name" . }}-config
            - secretRef:
                name: {{ .Values.straiker.foundation.secretName }}
            {{- if $otelEnabled }}
            - secretRef:
                name: {{ $otel.secretName | default "otel-secret" }}
                {{- if not ($otel.requireSecret | default false) }}
                optional: true
                {{- end }}
            {{- end }}
          env:
            - name: OTEL_SERVICE_NAME
              value: {{ $otel.serviceName | default "foundation" | quote }}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.version={{ .Values.straiker.foundation.image.version }},deployment.environment={{ .Values.straiker.foundation.environment }}"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            {{- toYaml .Values.straiker.foundation.resources | nindent 12 }}
      {{- with .Values.straiker.foundation.nodeSelector }}
      nodeSelector:
      {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.straiker.foundation.affinity }}
      affinity:
      {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.straiker.foundation.topologySpread }}
      {{- if .enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .maxSkew }}
          {{- with .minDomains }}
          minDomains: {{ . }}
          {{- end }}
          topologyKey: {{ .topologyKey }}
          whenUnsatisfiable: {{ .whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              app.straiker.io/app: foundation
              {{- include "straiker.selectorLabels" $ | nindent 14 }}
          {{- with .matchLabelKeys }}
          matchLabelKeys:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- end }}
      {{- end }}
      {{- with .Values.straiker.foundation.tolerations }}
      tolerations:
      {{- toYaml . | nindent 8 }}
      {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
