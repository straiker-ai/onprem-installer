{{- if .Values.straiker.foundation.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.straiker.foundation.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "straiker.labels" . | nindent 4 }}
  {{- with .Values.straiker.foundation.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
