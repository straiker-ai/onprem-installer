{{- if .Values.serviceAccount.create }}
---
# The identity every pod in this chart runs as.
#
# Carries no IRSA annotation on purpose: credentials come from an EKS Pod
# Identity association, which binds (cluster, namespace, serviceaccount) to a
# role as a cluster-scoped AWS resource. That association is created out of band
# and is NOT owned by this release -- a `helm uninstall` or a failed `--atomic`
# rollback must not be able to revoke the pods' AWS access, and re-creating it
# from a chart would make every deploy an IAM write.
#
# The association has to exist before the first deploy. Without it the pods have
# no AWS identity at all and exit on the first Secrets Manager call, which
# presents as a CrashLoop with a credentials error rather than anything that
# points at the missing association.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  labels:
    app.kubernetes.io/part-of: argus-v3
{{- end }}
