---
# ClusterIP, and no Ingress anywhere in this chart.
#
# The only caller is the API gateway, which reaches this over
# `argus-service.<namespace>:80` from the `public` namespace. v1's chart also
# renders an internet-facing ALB, which predates the gateway; reproducing it here
# would publish an unauthenticated route straight to an engine whose entire
# authentication is a header the gateway stamps and strips from client input.
#
# Named `argus-service` to match v1's Service name in its own namespace, so the
# gateway's upstream is `argus-service.<ns>` either way and cutting over is a
# namespace change rather than a hostname change.
apiVersion: v1
kind: Service
metadata:
  name: argus-service
  labels:
    app: argus-v3-app
    app.kubernetes.io/part-of: argus-v3
spec:
  type: ClusterIP
  selector:
    app: argus-v3-app
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      name: http
