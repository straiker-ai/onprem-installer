apiVersion: v1
kind: Service
metadata:
  name: {{ include "straiker.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "straiker.labels" . | nindent 4 }}
  {{- with .Values.straiker.portico.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  selector:
    app.straiker.io/app: portico
    {{- include "straiker.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: {{ .Values.straiker.portico.port }}
  type: ClusterIP
