{{- if .Values.glauth.enabled }}
{{- $g := .Values.glauth }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: glauth
  namespace: {{ include "glauth.namespace" . }}
  labels:
    {{- include "glauth.labels" . | nindent 4 }}
    app.kubernetes.io/component: identity
spec:
  replicas: 1
  selector:
    matchLabels:
      app: glauth
  template:
    metadata:
      labels:
        app: glauth
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/glauth-configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: glauth
          image: {{ include "glauth.image" . | quote }}
          imagePullPolicy: {{ $g.image.pullPolicy }}
          ports:
            - containerPort: 3893
              name: ldap
          resources:
            {{- toYaml $g.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /app/config/config.cfg
              subPath: config.cfg
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: glauth-config
      nodeSelector:
        {{- toYaml $g.nodeSelector | nindent 8 }}
      {{- with $g.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
