---
# Argus Engine
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argus-app
  namespace: {{ include "argus.namespace" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 10%
      maxSurge: 25%
  selector:
    matchLabels:
      app: argus-app
  template:
    metadata:
      labels:
        app: argus-app
    spec:
      serviceAccountName: argus-sa
      terminationGracePeriodSeconds: 30
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: argus
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 5"]
        image: {{ include "argus.image" . }}
        imagePullPolicy: IfNotPresent
        envFrom:
          - secretRef:
              name: {{ include "argus.secretName" . }}
          - secretRef:
              name: {{ include "argus.sessionSecretName" . }}
        env:
        - name: SYS__ARGUS_VERSION
          value: {{ include "argus.imageTag" . | quote }}
        - name: SYS__ARGUS_ENV
          value: "production"
        - name: SYS__SECRET_MANAGER_ENABLED
          value: {{ .Values.argus.secretManager.enabled | quote }}
        {{- if .Values.argus.secretManager.enabled }}
        - name: SYS__SECRET_MANAGER_REGION
          value: {{ .Values.argus.secretManager.region }}
        - name: SYS__SECRET_MANAGER_SECRET_NAME
          value: {{ .Values.argus.secretManager.secretName }}
        {{- end }}
        - name: SYS__REDIS_URL
          value: {{ if .Values.inClusterRedis.enabled }}{{ printf "redis://argus-redis.%s.svc.cluster.local:6379" (include "argus.namespace" .) }}{{ else }}{{ required "argus.redis.url is required when inClusterRedis.enabled=false" .Values.argus.redis.url }}{{ end }}
        - name: SYS__ARCHIVE_ENABLED
          value: {{ or .Values.argus.kinesis.enabled .Values.argus.redpanda.enabled | quote }}
        {{- if .Values.argus.kinesis.enabled }}
        - name: SYS__ARCHIVE_MODE
          value: "kinesis"
        - name: SYS__ARCHIVE_REGION
          value: {{ .Values.argus.kinesis.region }}
        - name: SYS__ARCHIVE_STREAM_TURNS
          value: {{ .Values.argus.kinesis.streamTurns }}
        - name: SYS__ARCHIVE_STREAM_TURNS_FLAGGED
          value: {{ .Values.argus.kinesis.streamTurnsFlagged }}
        - name: SYS__ARCHIVE_STREAM_TURNS_INSIGHTS
          value: {{ .Values.argus.kinesis.streamTurnsInsights }}
        {{- end }}
        {{- if .Values.argus.redpanda.enabled }}
        - name: SYS__ARCHIVE_MODE
          value: "redpanda"
        - name: SYS__ARCHIVE_KAFKA_BOOTSTRAP_SERVERS
          value: {{ include "argus.redpandaBootstrapServers" . | quote }}
        - name: SYS__ARCHIVE_STREAM_TURNS
          value: {{ .Values.argus.redpanda.streamTurns | quote }}
        - name: SYS__ARCHIVE_STREAM_TURNS_FLAGGED
          value: {{ .Values.argus.redpanda.streamTurnsFlagged | quote }}
        - name: SYS__ARCHIVE_STREAM_TURNS_INSIGHTS
          value: {{ .Values.argus.redpanda.streamTurnsInsights | quote }}
        {{- end }}
        - name: SYS__LLM_ENDPOINTS__LLAMA
          value: {{ printf "http://antman.%s.svc.cluster.local:8000/v1/completions" .Release.Namespace | quote }}
        - name: SYS__LLM_ENDPOINTS__INTERNLM
          value: {{ printf "http://quicksilver.%s.svc.cluster.local:8000/v1/completions" .Release.Namespace | quote }}
        - name: SYS__LLM_ENDPOINTS__QWEN
          value: {{ printf "http://thor.%s.svc.cluster.local:8000/v1/completions" .Release.Namespace | quote }}
        - name: SYS__LLM_ENDPOINTS__LLM_STOCK
          value: {{ printf "http://hulk.%s.svc.cluster.local:8000/v1/chat/completions" .Release.Namespace | quote }}
        - name: SYS__LLM_ENDPOINTS__LAVA
          value: {{ printf "http://hulk.%s.svc.cluster.local:8000/v1/chat/completions" .Release.Namespace | quote }}
        - name: SYS__LLM_ENDPOINTS__VISION
          value: {{ printf "http://vision.%s.svc.cluster.local:8000/v1/chat/completions" .Release.Namespace | quote }}
        # io_timeout: 30s covers T4 GPU latency (3-10s per call).
        - name: CUSTOMER__RUNTIME__IO_TIMEOUT
          value: "30.0"
        # categorySettings: float thresholds bypass CP settings API bug with string coercion.
        - name: CUSTOMER__DETECTION__CATEGORY_SETTINGS
          value: >-
            {"llm_evasion": {"mode": "block", "threshold": 0.4},
             "social_security_number": {"mode": "block", "threshold": 0.4},
             "credit_card_number": {"mode": "block", "threshold": 0.4},
             "bank_account_number": {"mode": "block", "threshold": 0.4},
             "us_passport_number": {"mode": "block", "threshold": 0.4},
             "employer_identification_number": {"mode": "block", "threshold": 0.4},
             "tax_identification_number": {"mode": "block", "threshold": 0.4}}
        - name: SYS__SELF_HOSTED
          value: "true"
        - name: SYS__SETTINGS_SYNC_ENABLED
          value: "true"
        - name: SYS__FOUNDATION_ENDPOINT
          value: {{ include "argus.foundationEndpoint" . | quote }}
        - name: SYS__ATTACHMENTS_S3_ENABLED
          value: {{ .Values.argus.attachments.enabled | quote }}
        {{- if .Values.argus.attachments.enabled }}
        - name: SYS__ATTACHMENTS_S3_BUCKET
          value: {{ .Values.argus.attachments.bucket }}
        - name: SYS__ATTACHMENTS_S3_REGION
          value: {{ .Values.argus.attachments.region }}
        - name: SYS__ATTACHMENTS_S3_PREFIX
          value: {{ .Values.argus.attachments.prefix }}
        {{- end }}
        - name: HF_HOME
          value: /models
        - name: HF_HUB_OFFLINE
          value: "1"
        - name: SENTENCE_TRANSFORMERS_HOME
          value: /models/hub
        ports:
        - containerPort: {{ .Values.service.targetPort }}
        startupProbe:
          httpGet:
            path: /api/v1/private/ping
            port: {{ .Values.service.targetPort }}
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 18
        livenessProbe:
          httpGet:
            path: /api/v1/private/ping
            port: {{ .Values.service.targetPort }}
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/v1/private/ping
            port: {{ .Values.service.targetPort }}
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        resources:
          requests:
            cpu: {{ .Values.resources.requests.cpu }}
            memory: {{ .Values.resources.requests.memory }}
          limits:
            memory: {{ .Values.resources.limits.memory }}
        volumeMounts:
        - name: model-cache
          mountPath: /models
      initContainers:
      - name: tokenizer-pull
        image: {{ include "argus.modelSyncImage" . }}
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - |
          set -e
          HUB="/models/hub"
          FAKE_HASH="aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          {{- $root := . }}
          {{- range list
            (dict "bucketName" "tokenizer/straikerinc--llama-3.2-3b-instruct-argus-v23"       "hfModelId" "straikerinc/Llama-3.2-3B-Instruct-argus-v23")
            (dict "bucketName" "tokenizer/straikerinc--internlm2_5-1_8b-chat-argus-v23"       "hfModelId" "straikerinc/internlm2_5-1_8b-chat-argus-v23")
            (dict "bucketName" "tokenizer/straikerinc--qwen2.5-3b-instruct-argus-v23"         "hfModelId" "straikerinc/Qwen2.5-3B-instruct-argus-v23")
            (dict "bucketName" "tokenizer/straikerinc--qwen3-4b-instruct-2507"                 "hfModelId" "straikerinc/Qwen3-4B-Instruct-2507")
            (dict "bucketName" "tokenizer/straikerinc--qwen3-1.7b"                            "hfModelId" "straikerinc/Qwen3-1.7B")
            (dict "bucketName" "tokenizer/straikerinc--qwen3-vl-2b-instruct-argus-384-color"  "hfModelId" "straikerinc/Qwen3-VL-2B-Instruct-argus-384-color")
            (dict "bucketName" "tokenizer/sentence-transformers--all-minilm-l6-v2"            "hfModelId" "sentence-transformers/all-MiniLM-L6-v2")
          }}
          {{- $cacheDir := printf "models--%s" (.hfModelId | replace "/" "--") }}
          if [ -f "${HUB}/{{ $cacheDir }}/refs/main" ]; then
            echo "Already cached: {{ .hfModelId }}"
          else
            echo "Pulling tokenizer for {{ .hfModelId }}..."
            mkdir -p /tmp/tok
            {{ include "argus.modelSyncCmd" (dict "root" $root "src" .bucketName "dst" "/tmp/tok") }}
            mkdir -p "${HUB}/{{ $cacheDir }}/snapshots/${FAKE_HASH}" \
                     "${HUB}/{{ $cacheDir }}/refs"
            cp -r /tmp/tok/. "${HUB}/{{ $cacheDir }}/snapshots/${FAKE_HASH}/"
            printf '%s' "${FAKE_HASH}" > "${HUB}/{{ $cacheDir }}/refs/main"
            rm -rf /tmp/tok
            echo "Done: {{ .hfModelId }}"
          fi
          {{- end }}
          echo "All tokenizers ready."
        volumeMounts:
        - name: model-cache
          mountPath: /models
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            memory: 1Gi

      # Converts synced tokenizer files for sentence-transformers models to
      # proper HF hub cache format (blobs + symlinks) that snapshot_download expects.
      - name: st-cache-fix
        image: {{ include "argus.image" . }}
        imagePullPolicy: IfNotPresent
        command:
        - python3
        - -c
        - |
          import os, hashlib, shutil
          HUB = "/models/hub"
          FAKE_HASH = "a" * 40
          models = ["sentence-transformers/all-MiniLM-L6-v2"]
          for hf_model_id in models:
              model_dir = "models--" + hf_model_id.replace("/", "--")
              storage = os.path.join(HUB, model_dir)
              snap = os.path.join(storage, "snapshots", FAKE_HASH)
              blobs = os.path.join(storage, "blobs")
              if not os.path.isdir(snap):
                  print(f"SKIP {hf_model_id}: snapshot dir missing")
                  continue
              if os.path.isdir(blobs):
                  print(f"SKIP {hf_model_id}: already converted")
                  continue
              os.makedirs(blobs, exist_ok=True)
              entries = []
              for dirpath, _, filenames in os.walk(snap):
                  for fn in filenames:
                      fpath = os.path.join(dirpath, fn)
                      if not os.path.islink(fpath):
                          rel = os.path.relpath(fpath, snap)
                          with open(fpath, "rb") as f:
                              sha = hashlib.sha256(f.read()).hexdigest()
                          entries.append((fpath, rel, sha))
              for fpath, rel, sha in entries:
                  blob = os.path.join(blobs, sha)
                  if not os.path.exists(blob):
                      shutil.copy2(fpath, blob)
                  os.remove(fpath)
                  depth = len(rel.split(os.sep)) + 1
                  os.symlink(os.path.join(*(['..'] * depth), "blobs", sha), fpath)
              print(f"OK {hf_model_id}: converted to blob cache")
        env:
        - name: HF_HOME
          value: /models
        volumeMounts:
        - name: model-cache
          mountPath: /models
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            memory: 512Mi
      volumes:
      - name: model-cache
        emptyDir:
          sizeLimit: 500Mi
      {{- include "argus.nodeSelector" . | nindent 6 }}
      {{- if .Values.karpenter.enabled }}
      tolerations:
      - key: "purpose"
        operator: "Equal"
        value: "straiker-argus"
        effect: "NoSchedule"
      {{- end }}

{{- if .Values.argus.foundation.syncEnabled }}
---
# Settings Synchronizer Daemon — one instance per cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: settings-synchronizer-daemon
  namespace: {{ include "argus.namespace" . }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: settings-synchronizer-daemon
  template:
    metadata:
      labels:
        app: settings-synchronizer-daemon
    spec:
      serviceAccountName: argus-sa
      containers:
      - name: settings-synchronizer-daemon
        image: {{ include "argus.image" . }}
        imagePullPolicy: IfNotPresent
        command: ["python", "-m", "argus.daemons.settings_synchronizer"]
        resources:
          requests:
            cpu: 500m
            memory: "1Gi"
          limits:
            memory: "1Gi"
        envFrom:
          - secretRef:
              name: {{ include "argus.secretName" . }}
        env:
        - name: SYS__SETTINGS_SYNC_ENABLED
          value: "true"
        - name: SYS__SELF_HOSTED
          value: "true"
        - name: SYS__FOUNDATION_ENDPOINT
          value: {{ include "argus.foundationEndpoint" . | quote }}
        - name: SYS__SECRET_MANAGER_ENABLED
          value: {{ .Values.argus.secretManager.enabled | quote }}
        {{- if .Values.argus.secretManager.enabled }}
        - name: SYS__SECRET_MANAGER_REGION
          value: {{ .Values.argus.secretManager.region }}
        - name: SYS__SECRET_MANAGER_SECRET_NAME
          value: {{ .Values.argus.secretManager.secretName }}
        {{- end }}
        - name: SYS__REDIS_URL
          value: {{ if .Values.inClusterRedis.enabled }}{{ printf "redis://argus-redis.%s.svc.cluster.local:6379" (include "argus.namespace" .) }}{{ else }}{{ required "argus.redis.url is required when inClusterRedis.enabled=false" .Values.argus.redis.url }}{{ end }}
      {{- include "argus.nodeSelector" . | nindent 6 }}
      {{- if .Values.karpenter.enabled }}
      tolerations:
      - key: "purpose"
        operator: "Equal"
        value: "straiker-argus"
        effect: "NoSchedule"
      {{- end }}
{{- end }}
