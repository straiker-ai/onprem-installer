{{- if .Values.inClusterRedis.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argus-redis
  namespace: {{ include "argus.namespace" . }}
  labels:
    {{- include "argus.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: argus-redis
  template:
    metadata:
      labels:
        app: argus-redis
    spec:
      containers:
        - name: redis
          image: {{ include "argus.redisImage" . }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: argus-redis
  namespace: {{ include "argus.namespace" . }}
  labels:
    {{- include "argus.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: argus-redis
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
{{- end }}
