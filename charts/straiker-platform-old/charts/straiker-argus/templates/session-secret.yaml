{{- $secretName := include "argus.sessionSecretName" . }}
{{- $existing := lookup "v1" "Secret" (include "argus.namespace" .) $secretName }}
{{- $sessionKey := "" }}
{{- if $existing }}
  {{- $sessionKey = index $existing.data "SYS__SESSION_SECRET_KEY" | b64dec }}
{{- else }}
  {{- $sessionKey = randAlphaNum 64 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ include "argus.namespace" . }}
  labels:
    {{- include "argus.labels" . | nindent 4 }}
  annotations:
    # Preserve across helm uninstall — rotating this key invalidates all user sessions.
    helm.sh/resource-policy: keep
type: Opaque
data:
  SYS__SESSION_SECRET_KEY: {{ $sessionKey | b64enc | quote }}
