{{- /*
Chart-managed secrets for control-plane auth.

  SESSION_SIGNING_KEY  — random 64-char alphanumeric, signs local JWT session
                         cookies. Generated on first install and preserved
                         across `helm upgrade` via `lookup`. Rotating this
                         value invalidates every active session.
  ADMIN_INVITE_TOKEN   — pre-shared token the bootstrap admin redeems at
                         ${ORIGIN}/invite/<token> to set their initial
                         password. Generated on first install and preserved.
                         Operator can override via .Values.bootstrap.inviteToken.

These are kept separate from the operator-supplied `straiker-secrets` (which
holds DB passwords, internal API keys, etc.) so that secrets the chart owns are
clearly distinguished from secrets the operator brings.
*/ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "cp.authSecretName" .) -}}
{{- $sessionKey := "" -}}
{{- if and $existing (index $existing.data "SESSION_SIGNING_KEY") -}}
{{-   $sessionKey = index $existing.data "SESSION_SIGNING_KEY" -}}
{{- else -}}
{{-   $sessionKey = randAlphaNum 64 | b64enc -}}
{{- end -}}
{{- $inviteToken := "" -}}
{{- if .Values.bootstrap.inviteToken -}}
{{-   $inviteToken = .Values.bootstrap.inviteToken | b64enc -}}
{{- else if and $existing (index $existing.data "ADMIN_INVITE_TOKEN") -}}
{{-   $inviteToken = index $existing.data "ADMIN_INVITE_TOKEN" -}}
{{- else -}}
{{-   $inviteToken = randAlphaNum 43 | b64enc -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cp.authSecretName" . }}
  namespace: {{ include "cp.namespace" . }}
  labels:
    {{- include "cp.labels" . | nindent 4 }}
  annotations:
    # pre-install/pre-upgrade so the secret exists before the migrate Job runs
    # (which references it via valueFrom). Negative weight orders this BEFORE
    # the migrate Job (weight 0). before-hook-creation lets `lookup` above read
    # the existing secret at render time before Helm replaces it — that's how
    # the values get preserved across upgrades.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
data:
  SESSION_SIGNING_KEY: {{ $sessionKey }}
  ADMIN_INVITE_TOKEN: {{ $inviteToken }}
